name: Clockwork StJoan SuperRoboyarou CI

on:
  push:
    branches:
      - stable/3v1-replay-targeting-fixed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anime-card-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate anime card fixes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Lua parser
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4

      - name: Validate scripts and stable multiplayer core
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ocgcore rev-parse HEAD)" = "a0bd861c521689e3e2f08a421845351a1274dc7f"
          sh ./ocgcore/tests/run_multiplayer_state_tests.sh
          sh ./ocgcore/tests/run_multiplayer_field_tests.sh

          luac5.4 -p multiplayer-deck-master/c511000405.lua
          luac5.4 -p multiplayer-deck-master/c22959079.lua
          luac5.4 -p multiplayer-deck-master/c21175632.lua
          luac5.4 -p multiplayer-deck-master/c153000012.lua

          # Clockwork Night: opponent effects are activation-time snapshots;
          # the controller's later Machine monsters still receive +500 ATK.
          grep -Fq 'e1:SetOperation(s.activate)' multiplayer-deck-master/c511000405.lua
          grep -Fq 'Duel.GetPlayerFieldGroup(p,LOCATION_MZONE)' multiplayer-deck-master/c511000405.lua
          grep -Fq 's.apply(sc,tc,500,false)' multiplayer-deck-master/c511000405.lua
          grep -Fq 's.apply(sc,tc,-500,true)' multiplayer-deck-master/c511000405.lua
          grep -Fq 'e1:SetValue(RACE_MACHINE)' multiplayer-deck-master/c511000405.lua
          grep -Fq 'e2:SetTargetRange(LOCATION_MZONE,LOCATION_MZONE)' multiplayer-deck-master/c511000405.lua
          grep -Fq 'function s.machineboosttarget' multiplayer-deck-master/c511000405.lua
          grep -Fq 'c:GetFlagEffect(id)==0' multiplayer-deck-master/c511000405.lua
          ! grep -Fq 'EVENT_SUMMON_SUCCESS' multiplayer-deck-master/c511000405.lua
          ! grep -Fq 'Card.IsDefensePos' multiplayer-deck-master/c511000405.lua

          # Dimensionhole: permanent banish; no temporary return and no reserved field zone.
          grep -Fq 'Duel.Remove(tc,POS_FACEUP,REASON_EFFECT)' multiplayer-deck-master/c22959079.lua
          ! grep -Fq 'REASON_TEMPORARY' multiplayer-deck-master/c22959079.lua
          ! grep -Fq 'ReturnToField' multiplayer-deck-master/c22959079.lua
          ! grep -Fq 'EFFECT_DISABLE_FIELD' multiplayer-deck-master/c22959079.lua

          # St. Joan: uses the same Quick Attack exemption consumed by Battle City/Virtual World rules.
          grep -Fq 'e1:SetCode(511004016)' multiplayer-deck-master/c21175632.lua
          grep -Fq 'not c:IsHasEffect(511004016)' multiplayer-deck-master/c153999999.lua

          # Super Roboyarou: exact logical owner without replay/view TagSwap.
          grep -Fq 'h:GetLogicalOwner()' multiplayer-deck-master/c153000012.lua
          ! grep -Fq 'Duel.TagSwap(' multiplayer-deck-master/c153000012.lua
          ! grep -Fq 'Duel.FocusLogicalPlayer' multiplayer-deck-master/c153000012.lua
          grep -Fq 'Duel.IsDeckMasterPlayer(logical,id)' multiplayer-deck-master/c153000012.lua
          grep -Fq 'POS_FACEUP_ATTACK' multiplayer-deck-master/c153000012.lua
          grep -Fq 'Duel.ChangeAttackTarget(c,true)' multiplayer-deck-master/c153000012.lua
          grep -Fq 'Duel.SSet(side,tc,side,false)' multiplayer-deck-master/c153000012.lua
          grep -Fq 'eboost:SetValue(1000)' multiplayer-deck-master/c153000012.lua
