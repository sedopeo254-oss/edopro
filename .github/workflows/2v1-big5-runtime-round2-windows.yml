name: 2v1 Big Five Runtime Round 2 Windows

on:
  push:
    branches:
      - fix/2v1-big5-runtime-fields-turns-20260924
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 2v1-big5-runtime-round2-${{ github.ref }}
  cancel-in-progress: true

env:
  BASELINE_SHA: 137c63b1977b4cdd3165747cbdf00c892116e9d0
  FEATURE_CORE_SHA: 48fc2f0de4a67766e9667f9669650c3f594a3255
  WINDBOT_SHA: fa0ae767967afc6a820784837f11cd3fabb9c47c

jobs:
  validate:
    name: Validate 2v1 turns fields resources and protected modes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify exact protected ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASELINE_SHA" HEAD
          test "$(git -C ocgcore rev-parse HEAD)" = "$FEATURE_CORE_SHA"

      - name: Materialize protected baseline and 2v1 runtime round2
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/install-4way-attack-guidance-armor.py
          python3 .github/scripts/apply-4way-anime-client-fixes.py
          python3 .github/scripts/apply-2v1-big5-from137-core.py
          python3 .github/scripts/apply-2v1-big5-from137-client-server.py
          python3 .github/scripts/fix-2v1-big5-mdmp-null-ui.py
          python3 .github/scripts/apply-2v1-big5-runtime-round2.py
          python3 -m py_compile .github/scripts/apply-2v1-big5-runtime-round2.py
          git diff --check
          git -C ocgcore diff --check

      - name: Guard exact runtime fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          core = Path('ocgcore/processor.cpp').read_text(encoding='utf-8')
          assert 'multiplayer.mode() == MultiplayerMode::TWO_V_ONE_BIG5' in core
          assert 'Processors::Turn>(multiplayer.field_side_of(first_logical))' in core

          cf = Path('gframe/client_field.cpp').read_text(encoding='utf-8')
          assert 'ApplyTwoVsOnePrivatePile' in cf
          assert 'DUEL_2_V_1_BIG5' in cf[cf.index('void ClientField::RefreshLogicalDeckMasters()'):cf.index('void ClientField::CycleTeamField()')]
          assert 'RefreshHandHitboxes();' in cf[cf.index('void ClientField::CycleTeamField()'):]

          eh = Path('gframe/event_handler.cpp').read_text(encoding='utf-8')
          hover = eh[eh.index('void ClientField::GetHoverField('):eh.index('void ClientField::ShowMenu', eh.index('void ClientField::GetHoverField('))]
          assert 'DUEL_2_V_1_BIG5' in hover
          assert 'field_focus[core_side]' in hover

          dc = Path('gframe/duelclient.cpp').read_text(encoding='utf-8')
          assert 'ApplyTwoVsOnePrivatePile(logical_player, false)' in dc
          assert 'mainGame->dInfo.HasFieldFlag(DUEL_2_V_1_BIG5)' in dc[dc.index('case MSG_ATTACK:'):dc.index('case MSG_BATTLE:', dc.index('case MSG_ATTACK:'))]

          gd = Path('gframe/generic_duel.cpp').read_text(encoding='utf-8')
          select = gd[gd.index('case MSG_SELECT_CARD:'):gd.index('case MSG_SELECT_TRIBUTE:')]
          assert 'ally_on_field' in select
          assert 'LOCATION_ONFIELD' in select

          game = Path('gframe/game.cpp').read_text(encoding='utf-8')
          start = game.index('void Game::UpdateMultiplayerMode()')
          end = game.index('\n}', start)
          assert 'ebStartLP' not in game[start:end+2]
          print('2v1 runtime round2 guards passed')
          PY

      - name: Compile and run full 2v1 Core integration
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/ocgcore"
          BUILD="${TMPDIR:-/tmp}/two-v-one-big5-runtime-round2"
          LUA="$ROOT/lua/src"
          mkdir -p "$BUILD"
          lua_objects=""
          for source in "$LUA"/*.c; do
            case "$(basename "$source")" in
              lua.c|ltests.c|onelua.c) continue ;;
            esac
            object="$BUILD/$(basename "${source%.c}").o"
            c++ -x c++ -std=c++20 -I"$LUA" -c "$source" -o "$object"
            lua_objects="$lua_objects $object"
          done
          c++ -std=c++20 -Wall -Wextra -Werror -Wno-missing-field-initializers             -I"$ROOT" -I"$LUA"             "$ROOT/card.cpp" "$ROOT/duel.cpp" "$ROOT/effect.cpp" "$ROOT/field.cpp"             "$ROOT/interpreter.cpp" "$ROOT/libcard.cpp" "$ROOT/libdebug.cpp"             "$ROOT/libduel.cpp" "$ROOT/libeffect.cpp" "$ROOT/libgroup.cpp"             "$ROOT/multiplayer.cpp" "$ROOT/ocgapi.cpp" "$ROOT/operations.cpp"             "$ROOT/playerop.cpp" "$ROOT/processor.cpp" "$ROOT/battle_royale_turn_order.cpp"             "$ROOT/processor_visit.cpp" "$ROOT/scriptlib.cpp"             .github/tests/two_vs_one_big5_from137_field_test.cpp             $lua_objects -ldl -lm -o "$BUILD/two-v-one-big5-runtime-round2"
          "$BUILD/two-v-one-big5-runtime-round2"

      - name: Re-run protected Battle Royale and 3v1 Core tests
        shell: bash
        run: |
          set -euo pipefail
          sh ./ocgcore/tests/run_multiplayer_state_tests.sh
          sh ./ocgcore/tests/run_multiplayer_field_tests.sh

      - name: Validate protected client and anime cards
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          for script in             multiplayer-deck-master/c199.lua             multiplayer-deck-master/c296499.lua             multiplayer-deck-master/c3819470.lua             multiplayer-deck-master/c412.lua             multiplayer-deck-master/c511001785.lua             multiplayer-deck-master/c58641905.lua             multiplayer-deck-master/c83555666.lua; do
            luac5.4 -p "$script"
          done
          grep -Fq 'CycleBattleRoyaleOpponent' gframe/client_field.cpp
          grep -Fq 'Swap the Team' gframe/duelclient.cpp
          grep -Fq 'Swap the player' gframe/duelclient.cpp

  windbot:
    name: Build protected WindBot runtime round2
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ProjectIgnis/windbot
          ref: ${{ env.WINDBOT_SHA }}
          path: windbot
          submodules: recursive
      - name: Apply protected multiplayer patches
        shell: bash
        run: |
          set -euo pipefail
          git -C windbot apply --unidiff-zero ../.github/patches/windbot-3v1.patch
          python3 .github/scripts/apply-windbot-battle-royale-loop.py windbot
          python3 .github/scripts/apply-windbot-2v1-big5-from137.py windbot
          grep -Fq 'public bool IsTwoVsOneBig5' windbot/ExecutorBase/Game/Duel.cs
          git -C windbot diff --check
      - name: Build WindBot
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/projectignis/mono_xamarin_builder_monodroid:master
          docker image tag ghcr.io/projectignis/mono_xamarin_builder_monodroid:master monodroid
          cd windbot
          docker run --rm --volume "$PWD:/project" monodroid -t:restore -p:RestorePackagesPath=./.nuget WindBot.sln
          ./ci/install-patched-mono-runtime.sh
          docker run --rm --volume "$PWD:/project" monodroid -m -p:Configuration=Release WindBot.sln -p:Posix=true
      - name: Package WindBot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p windbot-package/WindBot
          cp -r windbot/bin/Release/. windbot-package/WindBot/
          rm -f windbot-package/WindBot/mscorlib* windbot-package/WindBot/libWindbot*
          cp windbot/COPYING windbot/LICENSE windbot/bots.json windbot-package/WindBot/
          cp -r windbot/Decks windbot/Dialogs windbot-package/WindBot/
          test -f windbot-package/WindBot/WindBot.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windbot-2v1-big5-runtime-round2
          path: windbot-package/
          if-no-files-found: error

  windows:
    name: Windows x86 2v1 runtime round2 from 137c63b
    runs-on: windows-2022
    needs: [validate, windbot]
    env:
      TRAVIS_OS_NAME: windows
      BUILD_CONFIG: release
      ARCH: x86
      BUNDLED_CORE: "1"
      DXSDK_DIR: /c/d3d9sdk/
      VCPKG_ROOT: /c/vcpkg2
      VCPKG_CACHE_ZIP_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download/installed_x86-windows-static.zip
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Materialize runtime round2
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ocgcore rev-parse HEAD)" = "$FEATURE_CORE_SHA"
          python3 .github/scripts/install-4way-attack-guidance-armor.py
          python3 .github/scripts/apply-4way-anime-client-fixes.py
          python3 .github/scripts/apply-2v1-big5-from137-core.py
          python3 .github/scripts/apply-2v1-big5-from137-client-server.py
          python3 .github/scripts/fix-2v1-big5-mdmp-null-ui.py
          python3 .github/scripts/apply-2v1-big5-runtime-round2.py
          # GitHub's updated Windows image now builds Irrlicht sources containing
          # C++17 init-statements. Set the language level only for Irrlicht; this
          # changes no EDOPro/Core multiplayer behavior.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('irrlicht/premake5.lua')
          s = p.read_text(encoding='utf-8')
          marker = 'project "Irrlicht"\n\tkind "StaticLib"\n'
          replacement = 'project "Irrlicht"\n\tkind "StaticLib"\n\tcppdialect "C++17"\n'
          if replacement not in s:
              if marker not in s:
                  raise SystemExit('Irrlicht premake marker not found')
              s = s.replace(marker, replacement, 1)
              p.write_text(s, encoding='utf-8')
          PY
          grep -Fq 'cppdialect "C++17"' irrlicht/premake5.lua
          git diff --check
          git -C ocgcore diff --check
      - uses: microsoft/setup-msbuild@v3
      - name: Install v141 XP toolset
        shell: pwsh
        run: |
          Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
          $InstallPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $componentsToAdd = @(
            "Microsoft.VisualStudio.Component.VC.v141.x86.x64",
            "Microsoft.VisualStudio.Component.WinXP"
          )
          [string]$workloadArgs = $componentsToAdd | ForEach-Object { " --add " + $_ }
          $arguments = ('/c', "vs_installer.exe", 'modify', '--installPath', "`"$InstallPath`"", $workloadArgs, '--quiet', '--norestart', '--nocache')
          $process = Start-Process -FilePath "cmd.exe" -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Visual Studio Installer exited with code $($process.ExitCode)" }
      - name: Install Premake and dependencies
        shell: bash
        run: |
          ./travis/install-premake5.sh
          ./travis/dependencies.sh
      - name: Build bundled client
        shell: bash
        run: ./travis/build.sh
      - name: Package runtime round2
        shell: bash
        run: |
          set -euo pipefail
          ./travis/predeploy.sh
          mkdir -p deploy/textures deploy/expansions/script deploy/mode-info
          cp textures/field-3v1.png deploy/textures/field-3v1.png
          cp -r multiplayer-effect-examples deploy/
          cp -r multiplayer-deck-master deploy/
          cp multiplayer-effect-examples/c25880422.lua deploy/expansions/script/c25880422.lua
          cp multiplayer-deck-master/c*.lua deploy/expansions/script/
          cat > deploy/mode-info/2v1-big5-runtime-round2.txt <<'EOF'
          Yugi & Joey vs Big Five - runtime round 2
          Base: 137c63b1977b4cdd3165747cbdf00c892116e9d0
          Big Five physical first turn fixed.
          Joey/Yugi private piles switch atomically with focused field.
          Yugi/Joey encoded field hit-testing fixed.
          Deck Masters follow the focused logical player.
          Ally on-field cards stay selectable for Fusion/effects/tributes.
          2v1 attack logical target is used for arrow projection.
          Standard, Battle Royale and 3v1 retain their protected regression paths.
          EOF
          rm -f deploy/compressed-ygopro.exe
          test -f deploy/ygopro.exe
          test ! -f deploy/compressed-ygopro.exe
      - name: Immediate Windows startup smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "deploy\ygopro.exe").Path
          $p = Start-Process -FilePath $exe -WorkingDirectory (Resolve-Path ".").Path -ArgumentList "-r" -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) {
            if ($p.ExitCode -ne 0) { throw "ygopro.exe exited during startup with code $($p.ExitCode)" }
          } else {
            Stop-Process -Id $p.Id -Force
          }
      - uses: actions/download-artifact@v4
        with:
          name: windbot-2v1-big5-runtime-round2
          path: deploy/
      - uses: actions/upload-artifact@v4
        with:
          name: edopro-2v1-big5-runtime-round2-windows-x86-no-upx
          path: deploy/
          if-no-files-found: error
