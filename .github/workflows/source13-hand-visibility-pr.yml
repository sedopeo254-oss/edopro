name: Source13 Replay Hand Visibility

on:
  pull_request:
    branches:
      - stable/3v1-replay-targeting-fixed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source13-replay-hand-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source #13 replay policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Confirm source #13 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ocgcore rev-parse HEAD)" = "a0bd861c521689e3e2f08a421845351a1274dc7f"
          test -f .github/scripts/run-3v1-replay-smooth-v2.py
          test -f .github/patches/source13-hand-visibility.patch.gz.b64

      - name: Apply exact V2 source #13 and visibility patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/run-3v1-replay-smooth-v2.py
          base64 -d .github/patches/source13-hand-visibility.patch.gz.b64 | gzip -d > /tmp/source13-hand-visibility.patch
          git apply --check /tmp/source13-hand-visibility.patch
          git apply /tmp/source13-hand-visibility.patch

      - name: Install Lua
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4

      - name: Run multiplayer and script regressions
        shell: bash
        run: |
          set -euo pipefail
          sh ./ocgcore/tests/run_multiplayer_state_tests.sh
          sh ./ocgcore/tests/run_multiplayer_field_tests.sh
          luac5.4 -p multiplayer-deck-master/c153000012.lua
          luac5.4 -p multiplayer-deck-master/c511001152.lua
          luac5.4 -p multiplayer-deck-master/c511000405.lua
          grep -Fq 'replay_three_vs_one_visible_hand_mask' gframe/game.h
          grep -Fq 'IsThreeVsOneReplayHandVisible' gframe/game.h
          grep -Fq 'SetThreeVsOneReplayHands' gframe/duelclient.cpp
          grep -Fq 'ResetThreeVsOneReplayInteraction' gframe/duelclient.cpp
          grep -Fq 'IsReplayHandVisible(0)' gframe/event_handler.cpp
          grep -Fq 'draw_hand = dInfo.IsThreeVsOneReplayHandVisible' gframe/drawing.cpp
          grep -Fq '&& !mainGame->dInfo.isReplay' gframe/duelclient.cpp
          grep -Fq 'pcard->is_public = (current.position & POS_FACEUP)' gframe/duelclient.cpp
          grep -Fq 'pcard->is_public = true' gframe/duelclient.cpp
          ! grep -Fq 'Duel.FocusLogicalPlayer' multiplayer-deck-master/c153000012.lua
          ! grep -Fq 'Duel.TagSwap(' multiplayer-deck-master/c153000012.lua
          ! grep -Fq 'Duel.ConfirmCards(' multiplayer-deck-master/c153000012.lua
          grep -Fq 'Duel.ChangeAttackTarget(c,true)' multiplayer-deck-master/c153000012.lua
          grep -Fq 'eboost:SetValue(1000)' multiplayer-deck-master/c153000012.lua
          grep -Fq 'e1:SetValue(-1350)' multiplayer-deck-master/c511001152.lua
          grep -Fq 'std::atan2(xd - xa, ya - yd)' gframe/duelclient.cpp
          git -C ocgcore diff --check
          git diff --check

      - name: Replay hand policy simulation
        shell: bash
        run: |
          python3 - <<'PY'
          ACTIVE = {0, 1, 2, 3}

          def mask(turn, primary=None, secondary=None):
              visible = {turn}
              for logical in (primary, secondary):
                  if logical in ACTIVE:
                      visible.add(logical)
              return visible

          assert mask(2, 2) == {2}
          assert mask(3, 3) == {3}
          assert mask(3, 3, 1) == {1, 3}
          assert mask(1, 1, 0) == {0, 1}
          assert mask(1, 1) == {1}
          print('source #13 3v1 replay hand visibility policy passed')
          PY

  windows:
    name: Windows source #13 replay client
    runs-on: windows-2022
    needs: validate
    env:
      TRAVIS_OS_NAME: windows
      BUILD_CONFIG: release
      ARCH: x86
      BUNDLED_CORE: "1"
      DXSDK_DIR: /c/d3d9sdk/
      VCPKG_ROOT: /c/vcpkg2
      VCPKG_CACHE_ZIP_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download/installed_x86-windows-static.zip
      DEPENDENCIES_BASE_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download
      DEPLOY_DIR: deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply exact V2 source #13 and visibility patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/run-3v1-replay-smooth-v2.py
          base64 -d .github/patches/source13-hand-visibility.patch.gz.b64 | gzip -d > /tmp/source13-hand-visibility.patch
          git apply --check /tmp/source13-hand-visibility.patch
          git apply /tmp/source13-hand-visibility.patch

      - uses: microsoft/setup-msbuild@v3

      - name: Install v141 XP toolset
        shell: pwsh
        run: |
          Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
          $InstallPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $componentsToAdd = @("Microsoft.VisualStudio.Component.VC.v141.x86.x64","Microsoft.VisualStudio.Component.WinXP")
          [string]$workloadArgs = $componentsToAdd | ForEach-Object { " --add " + $_ }
          $arguments = ('/c', "vs_installer.exe", 'modify', '--installPath', "`"$InstallPath`"", $workloadArgs, '--quiet', '--norestart', '--nocache')
          $process = Start-Process -FilePath "cmd.exe" -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Visual Studio Installer exited with code $($process.ExitCode)" }

      - name: Install Premake
        shell: bash
        run: ./travis/install-premake5.sh

      - name: Install dependencies
        shell: bash
        run: ./travis/dependencies.sh

      - name: Build
        shell: bash
        run: ./travis/build.sh

      - name: Package no-UPX client
        shell: bash
        run: |
          set -euo pipefail
          ./travis/predeploy.sh
          mkdir -p deploy/expansions/script deploy/textures
          cp multiplayer-deck-master/c*.lua deploy/expansions/script/
          cp multiplayer-effect-examples/c25880422.lua deploy/expansions/script/c25880422.lua
          cp textures/field-3v1.png deploy/textures/field-3v1.png
          cp -r multiplayer-deck-master deploy/
          cp -r multiplayer-effect-examples deploy/
          rm -f deploy/compressed-ygopro.exe
          test -f deploy/ygopro.exe
          test -f deploy/expansions/script/c153000012.lua
          test -f deploy/expansions/script/c511001152.lua
          ! grep -Fq 'Duel.FocusLogicalPlayer' deploy/expansions/script/c153000012.lua
          ! grep -Fq 'Duel.TagSwap(' deploy/expansions/script/c153000012.lua
          ! grep -Fq 'Duel.ConfirmCards(' deploy/expansions/script/c153000012.lua

      - uses: actions/upload-artifact@v4
        with:
          name: edopro-source13-replay-hand-visibility-windows-x86-no-upx
          path: deploy/
          if-no-files-found: error
