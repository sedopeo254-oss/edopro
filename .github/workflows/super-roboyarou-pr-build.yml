name: Super Roboyarou PR Build

on:
  pull_request:
    branches:
      - stable/3v1-replay-targeting-fixed

permissions:
  contents: read

jobs:
  validate:
    name: Validate full replay, targeting and P2 owner lock
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Verify best replay baseline before owner-lock patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 42102739e2af74f816fcdbd9835730f7542f280c -- \
            gframe/client_field.cpp gframe/client_field.h gframe/duelclient.cpp
          git -C ocgcore diff --exit-code 4f21cd92c0956e46f51fbaf8386e0fd4bce87bbf..HEAD -- \
            field.cpp processor.cpp playerop.cpp operations.cpp
          test "$(git -C ocgcore rev-parse HEAD)" = "a0bd861c521689e3e2f08a421845351a1274dc7f"
      - name: Apply replay-safe owner lock
        run: python3 .github/scripts/apply-super-roboyarou-visible-grave-fix.py
      - name: Validate all regressions
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          sh ./ocgcore/tests/run_multiplayer_state_tests.sh
          sh ./ocgcore/tests/run_multiplayer_field_tests.sh
          luac5.4 -p multiplayer-deck-master/c153000012.lua
          luac5.4 -p multiplayer-deck-master/c511001152.lua
          luac5.4 -p multiplayer-deck-master/c511000405.lua

          # Preserve every replay/targeting correction from the best build.
          grep -Fq 'SetThreeVsOneView' gframe/duelclient.cpp
          grep -Fq 'IsThreeVsOneReplayPrivatePileDisplayed' gframe/client_field.cpp
          grep -Fq 'final arrow attached to the authoritative fields' gframe/duelclient.cpp
          grep -Fq 'std::atan2(xd - xa, ya - yd)' gframe/duelclient.cpp
          grep -Fq 'publish_multiplayer_effect_view' ocgcore/field.cpp
          grep -Fq 'authoritative attacker/target pair immediately before' ocgcore/processor.cpp

          # P2 Deck Master remains P2 without changing P3's displayed/replay field.
          grep -Fq 'preserve_private_duelist' ocgcore/field.cpp
          grep -Fq 'must not emit TAG_SWAP and mutate replay perspective' ocgcore/tests/multiplayer_field_tests.cpp
          grep -Fq 'battle damage redirected to P2' ocgcore/tests/multiplayer_field_tests.cpp
          grep -Fq 'A face-up Special Summon is public information' gframe/duelclient.cpp
          ! grep -Fq 'Duel.FocusLogicalPlayer' multiplayer-deck-master/c153000012.lua
          ! grep -Fq 'Duel.TagSwap(' multiplayer-deck-master/c153000012.lua
          grep -Fq 'Duel.ChangeAttackTarget(c,true)' multiplayer-deck-master/c153000012.lua
          grep -Fq 'eboost:SetValue(1000)' multiplayer-deck-master/c153000012.lua

          # Keep latest requested Dice Dungeon behavior.
          grep -Fq 'e1:SetValue(-1350)' multiplayer-deck-master/c511001152.lua
          grep -Fq 'code==15744417 or code==140000073' multiplayer-deck-master/c511001152.lua
          git -C ocgcore diff --check
          git diff --check

  windows:
    name: Windows replay-restored client
    runs-on: windows-2022
    needs: validate
    env:
      TRAVIS_OS_NAME: windows
      BUILD_CONFIG: release
      ARCH: x86
      BUNDLED_CORE: "1"
      DXSDK_DIR: /c/d3d9sdk/
      VCPKG_ROOT: /c/vcpkg2
      VCPKG_CACHE_ZIP_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download/installed_x86-windows-static.zip
      DEPENDENCIES_BASE_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download
      DEPLOY_DIR: deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply replay-safe owner lock
        shell: bash
        run: python .github/scripts/apply-super-roboyarou-visible-grave-fix.py
      - uses: microsoft/setup-msbuild@v3
      - name: Install v141 XP toolset
        shell: pwsh
        run: |
          Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
          $InstallPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $componentsToAdd = @("Microsoft.VisualStudio.Component.VC.v141.x86.x64","Microsoft.VisualStudio.Component.WinXP")
          [string]$workloadArgs = $componentsToAdd | ForEach-Object { " --add " + $_ }
          $arguments = ('/c', "vs_installer.exe", 'modify', '--installPath', "`"$InstallPath`"", $workloadArgs, '--quiet', '--norestart', '--nocache')
          $process = Start-Process -FilePath "cmd.exe" -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Visual Studio Installer exited with code $($process.ExitCode)" }
      - name: Install Premake
        shell: bash
        run: ./travis/install-premake5.sh
      - name: Install dependencies
        shell: bash
        run: ./travis/dependencies.sh
      - name: Build
        shell: bash
        run: ./travis/build.sh
      - name: Package replay-restored client
        shell: bash
        run: |
          set -euo pipefail
          ./travis/predeploy.sh
          mkdir -p deploy/expansions/script deploy/textures
          cp multiplayer-deck-master/c*.lua deploy/expansions/script/
          cp multiplayer-effect-examples/c25880422.lua deploy/expansions/script/c25880422.lua
          cp textures/field-3v1.png deploy/textures/field-3v1.png
          cp -r multiplayer-deck-master deploy/
          cp -r multiplayer-effect-examples deploy/
          rm -f deploy/compressed-ygopro.exe
          test -f deploy/ygopro.exe
          test -f deploy/expansions/script/c153000012.lua
          test -f deploy/expansions/script/c511001152.lua
      - uses: actions/upload-artifact@v4
        with:
          name: edopro-3v1-replay-restored-windows-x86-no-upx
          path: deploy/
          if-no-files-found: error
