name: 3v1 Replay Smooth Final Build

on:
  push:
    branches:
      - fix/3v1-replay-smooth-final-v2-20260826

permissions:
  contents: write

concurrency:
  group: 3v1-replay-smooth-final
  cancel-in-progress: true

env:
  DEPENDENCIES_BASE_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download
  DEPLOY_DIR: deploy

jobs:
  prepare:
    name: Apply, test and publish replay source
    runs-on: ubuntu-24.04
    outputs:
      commit_sha: ${{ steps.publish.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Use validated multiplayer core
        shell: bash
        run: |
          set -euo pipefail
          git -C ocgcore fetch origin bb0c48e455857156b55a223d1766d416e16dbf10
          git -C ocgcore checkout bb0c48e455857156b55a223d1766d416e16dbf10
          test "$(git -C ocgcore rev-parse HEAD)" = "bb0c48e455857156b55a223d1766d416e16dbf10"

      - name: Reconstruct and apply exact client patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/replay-smooth-final/client.patch.gz.b64.* > /tmp/client.patch.gz.b64
          echo "45f14c58e9b5eb96f8d57ab08d8e2687eedef24974cafadcdb839b35ce87417e  /tmp/client.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/client.patch.gz.b64 | gzip -dc > /tmp/client.patch
          echo "8ad24606a47044c934bb070c0f6d660a4fcdd093f21eefd84bbef2de58ceb9d4  /tmp/client.patch" | sha256sum -c -
          git apply --check /tmp/client.patch
          git apply /tmp/client.patch
          git diff --check

      - name: Test exact hand visibility policy
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror -I. \
            .github/tests/multiplayer_replay_policy_test.cpp \
            -o /tmp/multiplayer-replay-policy-test
          /tmp/multiplayer-replay-policy-test

      - name: Run multiplayer Core regressions
        shell: bash
        run: |
          set -euo pipefail
          sh ./ocgcore/tests/run_multiplayer_state_tests.sh
          sh ./ocgcore/tests/run_multiplayer_field_tests.sh

      - name: Verify replay and card behavior markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'GetThreeVsOneReplayHandLogical' gframe/game.h
          grep -Fq 'ShowThreeVsOneAffectedHand' gframe/duelclient.cpp
          grep -Fq 'RestoreThreeVsOneReplayTurnHand' gframe/duelclient.cpp
          grep -Fq 'RefreshPublicFieldCards' gframe/client_field.cpp
          grep -Fq 'Repeated snapshots are common in streamed 3v1 replays' gframe/client_field.cpp
          grep -Fq 'MSG_SPSUMMONING' gframe/duelclient.cpp
          grep -Fq 'pcard->SetCode(code)' gframe/duelclient.cpp
          grep -Fq 'Duel.ChangeAttackTarget(c,true)' multiplayer-deck-master/c153000012.lua
          grep -Fq 'eboost:SetValue(1000)' multiplayer-deck-master/c153000012.lua
          ! grep -Fq 'Duel.FocusLogicalPlayer' multiplayer-deck-master/c153000012.lua
          ! grep -Fq 'Duel.TagSwap(' multiplayer-deck-master/c153000012.lua
          grep -Fq 'SetValue(-1350)' multiplayer-deck-master/c511001152.lua
          grep -Fq '15744417' multiplayer-deck-master/c511001152.lua
          grep -Fq '140000073' multiplayer-deck-master/c511001152.lua
          grep -Fq 's.machineboosttarget' multiplayer-deck-master/c511000405.lua
          grep -Fq 'Duel.SelectEffectPlayers' multiplayer-effect-examples/c25880422.lua
          test -f textures/field-3v1.png

      - name: Publish tested source
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/replay-smooth-final
          rm -f .github/workflows/3v1-replay-smooth-final-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix 3v1 replay hands, smoothness and Deck Master images"
          git push origin HEAD:fix/3v1-replay-smooth-final-v2-20260826
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windbot:
    name: Build patched WindBot
    runs-on: ubuntu-24.04
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
      - uses: actions/checkout@v4
        with:
          repository: ProjectIgnis/windbot
          ref: fa0ae767967afc6a820784837f11cd3fabb9c47c
          path: windbot
          submodules: recursive
      - name: Apply 3v1 compatibility patch
        shell: bash
        run: git -C windbot apply --unidiff-zero ../.github/patches/windbot-3v1.patch
      - name: Build WindBot
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/projectignis/mono_xamarin_builder_monodroid:master
          docker image tag ghcr.io/projectignis/mono_xamarin_builder_monodroid:master monodroid
          cd windbot
          docker run --rm --volume "$PWD:/project" monodroid -t:restore -p:RestorePackagesPath=./.nuget WindBot.sln
          ./ci/install-patched-mono-runtime.sh
          docker run --rm --volume "$PWD:/project" monodroid -m -p:Configuration=Release WindBot.sln -p:Posix=true
      - name: Package WindBot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p windbot-package/WindBot
          cp -r windbot/bin/Release/. windbot-package/WindBot/
          rm -f windbot-package/WindBot/mscorlib* windbot-package/WindBot/libWindbot*
          cp windbot/COPYING windbot/LICENSE windbot/bots.json windbot-package/WindBot/
          cp -r windbot/Decks windbot/Dialogs windbot-package/WindBot/
          test -f windbot-package/WindBot/WindBot.exe
          test -f windbot-package/WindBot/ExecutorBase.dll
      - uses: actions/upload-artifact@v4
        with:
          name: windbot-3v1-replay-smooth-final
          path: windbot-package/
          if-no-files-found: error

  linux:
    name: Linux x64 bundled client
    runs-on: ubuntu-24.04
    needs: [prepare, windbot]
    env:
      TRAVIS_OS_NAME: linux
      BUILD_CONFIG: release
      ARCH: x64
      BUNDLED_CORE: "1"
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_CACHE_7Z_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download/installed_x64-linux.7z
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          submodules: recursive
      - name: Prepare runner
        shell: bash
        run: sudo apt-get remove -y libsqlite3-dev
      - name: Install Premake and dependencies
        shell: bash
        run: |
          ./travis/install-premake5.sh
          ./travis/dependencies.sh
      - name: Build
        shell: bash
        run: ./travis/build.sh
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          ./travis/predeploy.sh
          mkdir -p deploy/textures deploy/expansions/script
          cp textures/field-3v1.png deploy/textures/field-3v1.png
          cp -r multiplayer-effect-examples deploy/
          cp -r multiplayer-deck-master deploy/
          cp multiplayer-effect-examples/c25880422.lua deploy/expansions/script/c25880422.lua
          cp multiplayer-deck-master/c*.lua deploy/expansions/script/
          rm -f deploy/compressed-ygopro
          test -f deploy/ygopro
          test -f deploy/expansions/script/c153000012.lua
          test -f deploy/expansions/script/c511001152.lua
      - uses: actions/download-artifact@v4
        with:
          name: windbot-3v1-replay-smooth-final
          path: deploy/
      - uses: actions/upload-artifact@v4
        with:
          name: edopro-3v1-replay-smooth-final-linux-x64-no-upx
          path: deploy/
          if-no-files-found: error

  windows:
    name: Windows x86 bundled client
    runs-on: windows-2022
    needs: [prepare, windbot]
    env:
      TRAVIS_OS_NAME: windows
      BUILD_CONFIG: release
      ARCH: x86
      BUNDLED_CORE: "1"
      DXSDK_DIR: /c/d3d9sdk/
      VCPKG_ROOT: /c/vcpkg2
      VCPKG_CACHE_ZIP_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download/installed_x86-windows-static.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          submodules: recursive
      - uses: microsoft/setup-msbuild@v3
      - name: Install v141 XP toolset
        shell: pwsh
        run: |
          Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
          $InstallPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $componentsToAdd = @(
            "Microsoft.VisualStudio.Component.VC.v141.x86.x64",
            "Microsoft.VisualStudio.Component.WinXP"
          )
          [string]$workloadArgs = $componentsToAdd | ForEach-Object { " --add " + $_ }
          $arguments = ('/c', "vs_installer.exe", 'modify', '--installPath', "`"$InstallPath`"", $workloadArgs, '--quiet', '--norestart', '--nocache')
          $process = Start-Process -FilePath "cmd.exe" -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Visual Studio Installer exited with code $($process.ExitCode)" }
      - name: Install Premake and dependencies
        shell: bash
        run: |
          ./travis/install-premake5.sh
          ./travis/dependencies.sh
      - name: Build
        shell: bash
        run: ./travis/build.sh
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          ./travis/predeploy.sh
          mkdir -p deploy/textures deploy/expansions/script
          cp textures/field-3v1.png deploy/textures/field-3v1.png
          cp -r multiplayer-effect-examples deploy/
          cp -r multiplayer-deck-master deploy/
          cp multiplayer-effect-examples/c25880422.lua deploy/expansions/script/c25880422.lua
          cp multiplayer-deck-master/c*.lua deploy/expansions/script/
          rm -f deploy/compressed-ygopro.exe
          test -f deploy/ygopro.exe
          test -f deploy/expansions/script/c153000012.lua
          test -f deploy/expansions/script/c511001152.lua
      - uses: actions/download-artifact@v4
        with:
          name: windbot-3v1-replay-smooth-final
          path: deploy/
      - uses: actions/upload-artifact@v4
        with:
          name: edopro-3v1-replay-smooth-final-windows-x86-no-upx
          path: deploy/
          if-no-files-found: error
