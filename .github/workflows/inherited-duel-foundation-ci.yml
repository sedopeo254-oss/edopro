name: Inherited Duel Foundation CI

on:
  push:
    branches:
      - feature/inherited-duel-succession-v1-20261105
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Validate inherited mode client/core wiring
        run: python3 .github/tests/test_inherited_mode_foundation.py
      - name: Run Succession state machine unit tests
        run: sh ./ocgcore/tests/run_duel_succession_tests.sh
      - name: Validate no-duplicate succession deck transfer
        run: sh ./ocgcore/tests/run_duel_succession_transfer_tests.sh
      - name: Verify one visible duelist per field through succession and replay
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. .github/tests/inherited_duel_hud_test.cpp -o /tmp/inherited_duel_hud_test
          /tmp/inherited_duel_hud_test
      - name: Test explicit inherited lobby roles and Seto-first turn
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. .github/tests/inherited_duel_lobby_test.cpp -o /tmp/inherited_duel_lobby_test
          /tmp/inherited_duel_lobby_test
      - name: Test Inherited Duel attack arrows on both physical sides
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. .github/tests/inherited_duel_attack_arrow_test.cpp -o /tmp/inherited_duel_attack_arrow_test
          /tmp/inherited_duel_attack_arrow_test
      - name: Test Last Turn Deck Master selection, forced attack and End Phase rules
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.4
          lua5.4 .github/tests/inherited_last_turn_test.lua multiplayer-inherited-duel/c28566710.lua
      - name: Regression-test Shinato's Ark selection and stable control
        run: lua5.4 .github/tests/shinatos_ark_selection_test.lua multiplayer-deck-master/c153000017.lua
      - name: Gradius equip effects regression - Cyclon Laser and Matter Leveller
        run: lua5.4 .github/tests/gradius_equip_regression_test.lua multiplayer-anime-cards/c5494820.lua multiplayer-anime-cards/c511000219.lua
      - name: Test Gradius Option printed ATK DEF and inherited Equip effects
        run: lua5.4 .github/tests/gradius_option_anime_test.lua multiplayer-anime-cards/c14291024.lua
      - name: Test Shinato's Ark send-replacement nil-eg callback variants
        run: lua5.4 .github/tests/shinatos_ark_send_replace_test.lua multiplayer-deck-master/c153000017.lua
      - name: Re-run existing multiplayer state tests
        run: sh ./ocgcore/tests/run_multiplayer_state_tests.sh
      - name: Re-run existing multiplayer field tests
        run: sh ./ocgcore/tests/run_multiplayer_field_tests.sh
