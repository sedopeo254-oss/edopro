name: d45 Battle Royal Fixes Windows

on:
  push:
    branches:
      - fix/d45-battle-royal-card-fixes-20260910
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d45-battle-royal-fixes-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_COMMIT: d45ba39eff95c65ffc496b2b7d945130e3252fed
  FEATURE_CORE_SHA: 48fc2f0de4a67766e9667f9669650c3f594a3255
  WINDBOT_SHA: fa0ae767967afc6a820784837f11cd3fabb9c47c
  DEPENDENCIES_BASE_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download
  DEPLOY_DIR: deploy

jobs:
  validate:
    name: Validate exact d45 base and requested-only changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify exact d45 parent and Core
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_COMMIT"
          test "$(git -C ocgcore rev-parse HEAD)" = "$FEATURE_CORE_SHA"

      - name: Verify only requested files were added
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/allowed.txt <<'EOF'
          .github/patches/windbot-d45-multiplayer-slots.patch
          .github/workflows/d45-battle-royal-fixes-windows.yml
          battle-royal-card-fixes/c199.lua
          battle-royal-card-fixes/c296499.lua
          battle-royal-card-fixes/c3819470.lua
          battle-royal-card-fixes/c412.lua
          battle-royal-card-fixes/c511001785.lua
          EOF
          git diff --name-only "$BASE_COMMIT" HEAD | sort > /tmp/actual.txt
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/actual.txt
          test "$(git diff --name-status "$BASE_COMMIT" HEAD | awk '$1 != "A" {n++} END {print n+0}')" -eq 0

      - name: Syntax-check the five card scripts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          for f in battle-royal-card-fixes/c*.lua; do
            luac5.4 -p "$f"
          done
          test "$(find battle-royal-card-fixes -maxdepth 1 -type f -name 'c*.lua' | wc -l)" -eq 5

      - name: Run unchanged d45 Core multiplayer tests
        shell: bash
        run: |
          set -euo pipefail
          sh ./ocgcore/tests/run_multiplayer_state_tests.sh
          sh ./ocgcore/tests/run_multiplayer_field_tests.sh
          git diff --check "$BASE_COMMIT" HEAD

  windbot:
    name: WindBot d45 Battle Royal field-slot fix
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ProjectIgnis/windbot
          ref: fa0ae767967afc6a820784837f11cd3fabb9c47c
          path: windbot
          submodules: recursive

      - name: Apply only the d45 multiplayer field-slot patch
        shell: bash
        run: |
          set -euo pipefail
          git -C windbot apply --check --unidiff-zero ../.github/patches/windbot-d45-multiplayer-slots.patch
          git -C windbot apply --unidiff-zero ../.github/patches/windbot-d45-multiplayer-slots.patch
          grep -Fq 'BattleRoyaleMonsterZoneCount = StandardMonsterZoneCount * 2' windbot/ExecutorBase/Game/ClientField.cs
          grep -Fq 'BattleRoyaleSpellZoneCount = StandardSpellZoneCount * 2' windbot/ExecutorBase/Game/ClientField.cs
          grep -Fq 'DUEL_BATTLE_ROYALE_HIGH = 0x20' windbot/Game/GameBehavior.cs
          grep -Fq '_duel.IsBattleRoyale' windbot/Game/GameBehavior.cs

      - name: Pull Mono builder image
        shell: bash
        run: |
          docker pull ghcr.io/projectignis/mono_xamarin_builder_monodroid:master
          docker image tag ghcr.io/projectignis/mono_xamarin_builder_monodroid:master monodroid

      - name: Build patched WindBot
        shell: bash
        working-directory: windbot
        run: |
          docker run --rm --volume "$PWD:/project" monodroid -t:restore -p:RestorePackagesPath=./.nuget WindBot.sln
          ./ci/install-patched-mono-runtime.sh
          docker run --rm --volume "$PWD:/project" monodroid -m -p:Configuration=Release WindBot.sln -p:Posix=true

      - name: Package patched WindBot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p windbot-package/WindBot
          cp -r windbot/bin/Release/. windbot-package/WindBot/
          rm -f windbot-package/WindBot/mscorlib* windbot-package/WindBot/libWindbot*
          cp windbot/COPYING windbot/LICENSE windbot/bots.json windbot-package/WindBot/
          cp -r windbot/Decks windbot/Dialogs windbot-package/WindBot/
          test -f windbot-package/WindBot/WindBot.exe
          test -f windbot-package/WindBot/ExecutorBase.dll

      - uses: actions/upload-artifact@v4
        with:
          name: windbot-d45-battle-royal
          path: windbot-package/
          if-no-files-found: error

  windows:
    name: Windows x86 from exact d45 base
    runs-on: windows-2022
    needs:
      - validate
      - windbot
    env:
      TRAVIS_OS_NAME: windows
      BUILD_CONFIG: release
      ARCH: x86
      BUNDLED_CORE: "1"
      DXSDK_DIR: /c/d3d9sdk/
      VCPKG_ROOT: /c/vcpkg2
      VCPKG_CACHE_ZIP_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download/installed_x86-windows-static.zip
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify exact d45 base before building
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_COMMIT"
          test "$(git -C ocgcore rev-parse HEAD)" = "$FEATURE_CORE_SHA"

      - uses: microsoft/setup-msbuild@v3

      - name: Install v141 XP toolset
        shell: pwsh
        run: |
          Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
          $InstallPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $componentsToAdd = @(
            "Microsoft.VisualStudio.Component.VC.v141.x86.x64",
            "Microsoft.VisualStudio.Component.WinXP"
          )
          [string]$workloadArgs = $componentsToAdd | ForEach-Object { " --add " + $_ }
          $arguments = ('/c', "vs_installer.exe", 'modify', '--installPath', "`"$InstallPath`"", $workloadArgs, '--quiet', '--norestart', '--nocache')
          $process = Start-Process -FilePath "cmd.exe" -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Visual Studio Installer exited with code $($process.ExitCode)" }

      - name: Install Premake and dependencies
        shell: bash
        run: |
          ./travis/install-premake5.sh
          ./travis/dependencies.sh

      - name: Build unchanged d45 EDOPro client and Core
        shell: bash
        run: ./travis/build.sh

      - name: Package d45 client plus only the requested card scripts
        shell: bash
        run: |
          set -euo pipefail
          ./travis/predeploy.sh
          mkdir -p deploy/textures deploy/expansions/script
          cp textures/field-3v1.png deploy/textures/field-3v1.png
          cp -r multiplayer-effect-examples deploy/
          cp -r multiplayer-deck-master deploy/
          cp multiplayer-effect-examples/c25880422.lua deploy/expansions/script/c25880422.lua
          cp multiplayer-deck-master/c*.lua deploy/expansions/script/
          cp battle-royal-card-fixes/c*.lua deploy/expansions/script/
          rm -f deploy/compressed-ygopro.exe
          test -f deploy/ygopro.exe
          test -f deploy/expansions/script/c199.lua
          test -f deploy/expansions/script/c296499.lua
          test -f deploy/expansions/script/c3819470.lua
          test -f deploy/expansions/script/c412.lua
          test -f deploy/expansions/script/c511001785.lua
          test ! -f deploy/compressed-ygopro.exe

      - uses: actions/download-artifact@v4
        with:
          name: windbot-d45-battle-royal
          path: deploy/

      - name: Verify packaged WindBot
        shell: bash
        run: |
          set -euo pipefail
          test -f deploy/WindBot/WindBot.exe
          test -f deploy/WindBot/ExecutorBase.dll

      - uses: actions/upload-artifact@v4
        with:
          name: edopro-d45-battle-royal-fixes-windows-x86-no-upx
          path: deploy/
          if-no-files-found: error
