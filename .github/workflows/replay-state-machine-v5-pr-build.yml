name: 3v1 Replay Event State V5

on:
  pull_request:
    branches:
      - stable/3v1-replay-targeting-fixed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate event-driven replay isolation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply Replay V5
        run: python3 .github/scripts/run-3v1-replay-state-machine-v5.py
      - name: Install Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
      - name: Run replay and multiplayer regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/test-3v1-replay-state-machine-v5.py
          sh ./ocgcore/tests/run_multiplayer_state_tests.sh
          sh ./ocgcore/tests/run_multiplayer_field_tests.sh
          luac5.4 -p multiplayer-deck-master/c153000012.lua
          luac5.4 -p multiplayer-deck-master/c511001152.lua
          luac5.4 -p multiplayer-deck-master/c511000405.lua
          luac5.4 -p multiplayer-effect-examples/c25880422.lua
          grep -Fq 'three_vs_one_replay_hand_mask' gframe/game.h
          grep -Fq 'logical_deck_master_visible' gframe/game.h
          grep -Fq 'RefreshThreeVsOneReplayField' gframe/client_field.cpp
          grep -Fq 'ApplyThreeVsOneReplayPrivatePile' gframe/duelclient.cpp
          grep -Fq 'Consume TAG_SWAP as authoritative logical/private state' gframe/duelclient.cpp
          grep -Fq 'Damage alone must not change the 3v1 replay hand/camera' gframe/duelclient.cpp
          grep -Fq 'pile[i]->location == LOCATION_GRAVE' gframe/client_field.cpp
          ! grep -Fq 'Duel.FocusLogicalPlayer' multiplayer-deck-master/c153000012.lua
          ! grep -Fq 'Duel.TagSwap(' multiplayer-deck-master/c153000012.lua
          git -C ocgcore diff --check
          git diff --check

  windows:
    name: Windows x86 no-UPX replay V5
    runs-on: windows-2022
    needs: validate
    env:
      TRAVIS_OS_NAME: windows
      BUILD_CONFIG: release
      ARCH: x86
      BUNDLED_CORE: "1"
      DXSDK_DIR: /c/d3d9sdk/
      VCPKG_ROOT: /c/vcpkg2
      VCPKG_CACHE_ZIP_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download/installed_x86-windows-static.zip
      DEPENDENCIES_BASE_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download
      DEPLOY_DIR: deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply Replay V5
        shell: bash
        run: python .github/scripts/run-3v1-replay-state-machine-v5.py
      - uses: microsoft/setup-msbuild@v3
      - name: Install v141 XP toolset
        shell: pwsh
        run: |
          Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
          $InstallPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $componentsToAdd = @("Microsoft.VisualStudio.Component.VC.v141.x86.x64","Microsoft.VisualStudio.Component.WinXP")
          [string]$workloadArgs = $componentsToAdd | ForEach-Object { " --add " + $_ }
          $arguments = ('/c', "vs_installer.exe", 'modify', '--installPath', "`"$InstallPath`"", $workloadArgs, '--quiet', '--norestart', '--nocache')
          $process = Start-Process -FilePath "cmd.exe" -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Visual Studio Installer exited with code $($process.ExitCode)" }
      - name: Install Premake
        shell: bash
        run: ./travis/install-premake5.sh
      - name: Install dependencies
        shell: bash
        run: ./travis/dependencies.sh
      - name: Build
        shell: bash
        run: ./travis/build.sh
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          ./travis/predeploy.sh
          mkdir -p deploy/expansions/script deploy/textures
          cp multiplayer-deck-master/c*.lua deploy/expansions/script/
          cp multiplayer-effect-examples/c25880422.lua deploy/expansions/script/c25880422.lua
          cp textures/field-3v1.png deploy/textures/field-3v1.png
          cp -r multiplayer-deck-master deploy/
          cp -r multiplayer-effect-examples deploy/
          rm -f deploy/compressed-ygopro.exe
          test -f deploy/ygopro.exe
          test -f deploy/WindBot/WindBot.exe
          test -f deploy/textures/field-3v1.png
          ! test -f deploy/compressed-ygopro.exe
          cat > deploy/REPLAY-V5-BUILD.txt <<EOF
          3v1 Replay Event State V5
          - Hands render only for the turn player or current attack/target participants.
          - Duplicate replay-view/private-pile packets are cache-only.
          - TAG_SWAP updates logical ownership without destructive replay animation.
          - Super Roboyarou keeps artwork on summon and in Graveyard.
          - Scoped to 3v1 replay; Standard and live duels are unchanged.
          Source commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_RUN_ID}
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: edopro-3v1-replay-event-v5-windows-x86-no-upx
          path: deploy/
          if-no-files-found: error
