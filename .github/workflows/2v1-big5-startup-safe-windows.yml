name: 2v1 Big Five Startup Safe Windows

on:
  push:
    branches:
      - fix/2v1-big5-startup-safe-20260916
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 2v1-big5-startup-safe-${{ github.ref }}
  cancel-in-progress: true

env:
  PROTECTED_3V1_SHA: ef0b3f205cfd97b5fae6a181e1164c737affc896
  FEATURE_CORE_SHA: 48fc2f0de4a67766e9667f9669650c3f594a3255
  WINDBOT_SHA: fa0ae767967afc6a820784837f11cd3fabb9c47c
  DEPLOY_DIR: deploy

jobs:
  validate:
    name: Validate safe 2v1 fix and protected modes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify known-launching baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ocgcore rev-parse HEAD)" = "$FEATURE_CORE_SHA"
          test "$(git ls-remote origin refs/heads/stable/3v1-replay-targeting-fixed | cut -f1)" = "$PROTECTED_3V1_SHA"
          git merge-base --is-ancestor 74d38a97aa7075bba79603951061420030d2872d HEAD

      - name: Materialize protected features and startup-safe 2v1 fix
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/install-4way-attack-guidance-armor.py
          python3 .github/scripts/apply-4way-anime-client-fixes.py
          python3 .github/scripts/apply-2v1-big5-core.py
          python3 .github/scripts/apply-2v1-big5-client.py
          python3 .github/scripts/apply-2v1-big5-safe-runtime.py

          # Keep the original composite marker that was proven to launch.
          grep -Fq '#define DUEL_2_V_1_BIG5        (DUEL_3_V_1 | 0x8000000000ULL)' ocgcore/ocgapi_constants.h
          grep -Fq '#define DUEL_2_V_1_BIG5        (DUEL_3_V_1 | 0x8000000000ULL)' gframe/ocgapi_constants.h
          # Exact three-player scenario state.
          grep -Fq 'players_mask = 0x07;' ocgcore/multiplayer.cpp
          grep -Fq 'turn_order = { 2, 0, 1, 3 };' ocgcore/multiplayer.cpp
          grep -Fq 'active_player_mask = mainGame->dInfo.HasFieldFlag(DUEL_2_V_1_BIG5) ? 0x07' gframe/duelclient.cpp
          grep -Fq 'logical_player_count' gframe/drawing.cpp
          # Critical guard: never dereference the inactive fourth logical slot.
          grep -Fq 'if(!multiplayer.is_active(logical)) {' ocgcore/processor.cpp
          grep -Fq 'for(uint8_t field = 0; field < 6; ++field)' ocgcore/processor.cpp
          # Scenario identity must survive custom-rule refresh.
          grep -Fq 'two_vs_one_big5 ? DUEL_2_V_1_BIG5' gframe/game.cpp
          git diff --check
          git -C ocgcore diff --check

      - name: Run Big Five topology test
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror -Iocgcore \
            .github/tests/two_vs_one_big5_state_test.cpp \
            ocgcore/multiplayer.cpp -o /tmp/two_vs_one_big5_state_test
          /tmp/two_vs_one_big5_state_test

      - name: Verify independent piles and shared Fusion field
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'extra_lists_main' ocgcore/field.h
          grep -Fq 'extra_lists_hand' ocgcore/field.h
          grep -Fq 'extra_lists_extra' ocgcore/field.h
          grep -Fq 'extra_lists_grave' ocgcore/field.h
          grep -Fq 'extra_lists_remove' ocgcore/field.h
          grep -Fq 'extra_lps' ocgcore/field.h
          grep -Fq 'void field::get_fusion_material(uint8_t playerid, card_set* material)' ocgcore/field.cpp
          grep -Fq 'for(auto& pcard : player[playerid].list_mzone)' ocgcore/field.cpp

      - name: Run protected Core regressions
        shell: bash
        run: |
          set -euo pipefail
          sh ./ocgcore/tests/run_multiplayer_state_tests.sh
          sh ./ocgcore/tests/run_multiplayer_field_tests.sh
          grep -Fq 'Kaiba 3300 must go first' ocgcore/tests/multiplayer_state_tests.cpp
          grep -Fq '3v1 must reject Battle Royale turn-order changes' ocgcore/tests/multiplayer_state_tests.cpp

      - name: Run protected client and anime-card regressions
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          for script in \
            multiplayer-deck-master/c199.lua \
            multiplayer-deck-master/c296499.lua \
            multiplayer-deck-master/c3819470.lua \
            multiplayer-deck-master/c412.lua \
            multiplayer-deck-master/c511001785.lua \
            multiplayer-deck-master/c58641905.lua \
            multiplayer-deck-master/c83555666.lua; do
            luac5.4 -p "$script"
          done
          for test in \
            battle_royale_live_ec2_test.cpp \
            battle_royale_replay_smoothing_test.cpp \
            battle_royale_private_snapshot_test.cpp \
            multiplayer_replay_policy_test.cpp \
            multiplayer_attack_arrow_test.cpp \
            multiplayer_replay_animation_test.cpp; do
            if test -f ".github/tests/$test"; then
              c++ -std=c++17 -Wall -Wextra -Werror -I. \
                ".github/tests/$test" -o "/tmp/${test%.cpp}"
              "/tmp/${test%.cpp}"
            fi
          done
          grep -Fq 'CycleBattleRoyaleOpponent' gframe/client_field.cpp
          grep -Fq 'Swap the player' gframe/duelclient.cpp
          grep -Fq 'Swap the Team' gframe/duelclient.cpp
          grep -Fq 'Swap Yugi / Joey' gframe/duelclient.cpp
          grep -Fq 'EVENT_PRE_BATTLE_DAMAGE' multiplayer-deck-master/c511001785.lua
          grep -Fq 'function s.findchainfor' multiplayer-deck-master/c199.lua

  windbot:
    name: Build protected WindBot with 2v1 sizing
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ProjectIgnis/windbot
          ref: ${{ env.WINDBOT_SHA }}
          path: windbot
          submodules: recursive
      - name: Apply existing multiplayer guards and safe 2v1 sizing
        shell: bash
        run: |
          set -euo pipefail
          git -C windbot apply --unidiff-zero ../.github/patches/windbot-3v1.patch
          python3 .github/scripts/apply-windbot-battle-royale-loop.py windbot
          python3 .github/scripts/apply-windbot-2v1-big5-safe.py windbot
          grep -Fq 'public bool IsThreeVsOne' windbot/ExecutorBase/Game/Duel.cs
          grep -Fq 'public bool IsBattleRoyale' windbot/ExecutorBase/Game/Duel.cs
          grep -Fq 'public bool IsTwoVsOneBig5' windbot/ExecutorBase/Game/Duel.cs
          grep -Fq 'TwoVsOneMonsterZoneCount' windbot/ExecutorBase/Game/ClientField.cs
          git -C windbot diff --check
      - name: Build WindBot
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/projectignis/mono_xamarin_builder_monodroid:master
          docker image tag ghcr.io/projectignis/mono_xamarin_builder_monodroid:master monodroid
          cd windbot
          docker run --rm --volume "$PWD:/project" monodroid -t:restore -p:RestorePackagesPath=./.nuget WindBot.sln
          ./ci/install-patched-mono-runtime.sh
          docker run --rm --volume "$PWD:/project" monodroid -m -p:Configuration=Release WindBot.sln -p:Posix=true
      - name: Package WindBot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p windbot-package/WindBot
          cp -r windbot/bin/Release/. windbot-package/WindBot/
          rm -f windbot-package/WindBot/mscorlib* windbot-package/WindBot/libWindbot*
          cp windbot/COPYING windbot/LICENSE windbot/bots.json windbot-package/WindBot/
          cp -r windbot/Decks windbot/Dialogs windbot-package/WindBot/
          test -f windbot-package/WindBot/WindBot.exe
          test -f windbot-package/WindBot/ExecutorBase.dll
      - uses: actions/upload-artifact@v4
        with:
          name: windbot-2v1-startup-safe
          path: windbot-package/
          if-no-files-found: error

  windows:
    name: Windows x86 startup-safe Big Five 2v1
    runs-on: windows-2022
    needs: [validate, windbot]
    env:
      TRAVIS_OS_NAME: windows
      BUILD_CONFIG: release
      ARCH: x86
      BUNDLED_CORE: "1"
      DXSDK_DIR: /c/d3d9sdk/
      VCPKG_ROOT: /c/vcpkg2
      VCPKG_CACHE_ZIP_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download/installed_x86-windows-static.zip
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply protected baseline and startup-safe 2v1 fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ocgcore rev-parse HEAD)" = "$FEATURE_CORE_SHA"
          python3 .github/scripts/install-4way-attack-guidance-armor.py
          python3 .github/scripts/apply-4way-anime-client-fixes.py
          python3 .github/scripts/apply-2v1-big5-core.py
          python3 .github/scripts/apply-2v1-big5-client.py
          python3 .github/scripts/apply-2v1-big5-safe-runtime.py
          grep -Fq '(DUEL_3_V_1 | 0x8000000000ULL)' ocgcore/ocgapi_constants.h
          grep -Fq 'if(!multiplayer.is_active(logical)) {' ocgcore/processor.cpp
          git diff --check
          git -C ocgcore diff --check
      - uses: microsoft/setup-msbuild@v3
      - name: Install v141 XP toolset
        shell: pwsh
        run: |
          Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
          $InstallPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $componentsToAdd = @(
            "Microsoft.VisualStudio.Component.VC.v141.x86.x64",
            "Microsoft.VisualStudio.Component.WinXP"
          )
          [string]$workloadArgs = $componentsToAdd | ForEach-Object { " --add " + $_ }
          $arguments = ('/c', "vs_installer.exe", 'modify', '--installPath', "`"$InstallPath`"", $workloadArgs, '--quiet', '--norestart', '--nocache')
          $process = Start-Process -FilePath "cmd.exe" -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Visual Studio Installer exited with code $($process.ExitCode)" }
      - name: Install Premake and dependencies
        shell: bash
        run: |
          ./travis/install-premake5.sh
          ./travis/dependencies.sh
      - name: Build bundled client
        shell: bash
        run: ./travis/build.sh
      - name: Package client and protected content
        shell: bash
        run: |
          set -euo pipefail
          ./travis/predeploy.sh
          mkdir -p deploy/textures deploy/expansions/script deploy/mode-info
          cp textures/field-3v1.png deploy/textures/field-3v1.png
          cp -r multiplayer-effect-examples deploy/
          cp -r multiplayer-deck-master deploy/
          cp multiplayer-effect-examples/c25880422.lua deploy/expansions/script/c25880422.lua
          cp multiplayer-deck-master/c*.lua deploy/expansions/script/
          cat > deploy/mode-info/2v1-big5.txt <<'EOF'
          Yugi & Joey vs Big Five - startup-safe P4 crash fix
          Logical players: Joey=0, Yugi=1, Big Five=2
          Active mask: 0x07; logical slot 3 is inactive and serialized as zeros.
          Turn order: Big Five -> Joey -> Yugi
          LP: Joey 4000, Yugi 4000, Big Five 8000
          This build keeps the original composite 2v1 marker from the known-launching build.
          Standard, Battle Royale and protected 3v1 regressions are unchanged.
          EOF
          rm -f deploy/compressed-ygopro.exe
          test -f deploy/ygopro.exe
          test -f deploy/mode-info/2v1-big5.txt
          test ! -f deploy/compressed-ygopro.exe
      - name: PE and immediate-startup smoke check
        shell: pwsh
        run: |
          $exe = (Resolve-Path "deploy\ygopro.exe").Path
          if (-not (Test-Path $exe)) { throw "ygopro.exe missing" }
          $p = Start-Process -FilePath $exe -WorkingDirectory (Resolve-Path ".").Path -ArgumentList "-r" -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) {
            if ($p.ExitCode -ne 0) { throw "ygopro.exe exited during startup with code $($p.ExitCode)" }
            Write-Host "ygopro.exe completed startup probe with exit code 0"
          } else {
            Write-Host "ygopro.exe remained alive for startup probe"
            Stop-Process -Id $p.Id -Force
          }
      - uses: actions/download-artifact@v4
        with:
          name: windbot-2v1-startup-safe
          path: deploy/
      - uses: actions/upload-artifact@v4
        with:
          name: edopro-2v1-big5-startup-safe-p4-fix-windows-x86-no-upx
          path: deploy/
          if-no-files-found: error
