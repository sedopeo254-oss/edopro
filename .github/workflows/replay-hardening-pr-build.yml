name: 3v1 Replay Hardening PR Build

on:
  pull_request:
    branches:
      - stable/3v1-replay-targeting-fixed

permissions:
  contents: read

jobs:
  validate:
    name: Validate replay hardening v3 regressions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply replay-safe P2 Deck Master ownership
        run: python3 .github/scripts/apply-3v1-core-owner-no-view-swap.py
      - name: Apply replay hardening
        run: |
          python3 .github/scripts/apply-3v1-replay-hardening.py
          python3 .github/scripts/apply-3v1-replay-hardening-v2.py
          python3 .github/scripts/apply-3v1-replay-projection-v3.py
      - name: Install Lua parser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
      - name: Run regressions
        shell: bash
        run: |
          set -euo pipefail
          sh ./ocgcore/tests/run_multiplayer_state_tests.sh
          sh ./ocgcore/tests/run_multiplayer_field_tests.sh
          luac5.4 -p multiplayer-deck-master/c153000012.lua
          luac5.4 -p multiplayer-deck-master/c511001152.lua
          luac5.4 -p multiplayer-deck-master/c511000405.lua

          # First-stage replay hardening.
          grep -Fq 'const bool same_snapshot' gframe/client_field.cpp
          grep -Fq 'Authoritative replay snapshots beat visual recapture' gframe/client_field.cpp
          grep -Fq 'Replay view changes are visual only' gframe/client_field.cpp
          grep -Fq 'Identical view hints are common in attack/target sequences' gframe/duelclient.cpp
          grep -Fq 'Never replay TAG_SWAP' gframe/duelclient.cpp
          grep -Fq 'SetThreeVsOneView(target_logical)' gframe/duelclient.cpp

          # V2: Card of Sanctity/off-focus draws update the active logical cache.
          grep -Fq '&& mainGame->dField.multiplayer_private_piles_valid[logical_player]) {' gframe/duelclient.cpp
          grep -Fq 'UpdateMultiplayerPrivateDraw(logical_player, drawn_cards)' gframe/duelclient.cpp
          grep -Fq 'IsThreeVsOneReplayPrivatePileDisplayed(logical_player)' gframe/duelclient.cpp

          # V2: stable card objects and texture rebinding.
          grep -Fq 'pile[i]->SetCode(cards[i].code)' gframe/client_field.cpp
          grep -Fq 'deck[player].back()->SetCode(snapshot.top_code)' gframe/client_field.cpp
          grep -Fq 'RefreshHandHitboxes();' gframe/client_field.cpp
          grep -Fq 'pcard->is_public = true;' gframe/duelclient.cpp

          # V3: preserve identity only while the same logical player remains projected.
          grep -Fq 'multiplayer_projected_logical' gframe/client_field.h
          grep -Fq 'const bool reset_identity = multiplayer_projected_logical[display_side] != projected;' gframe/client_field.cpp
          grep -Fq 'if(reset_identity) {' gframe/client_field.cpp
          grep -Fq 'multiplayer_projected_logical[display_side] = projected;' gframe/client_field.cpp

          # P2 Deck Master ownership/view safety remains intact.
          grep -Fq 'preserve_private_duelist' ocgcore/field.cpp
          grep -Fq 'moving P2'"'"'s Deck Master must not change the P3 replay/view focus' ocgcore/tests/multiplayer_field_tests.cpp
          ! grep -Fq 'Duel.FocusLogicalPlayer' multiplayer-deck-master/c153000012.lua
          ! grep -Fq 'Duel.TagSwap(' multiplayer-deck-master/c153000012.lua
          grep -Fq 'Duel.ChangeAttackTarget(c,true)' multiplayer-deck-master/c153000012.lua
          grep -Fq 'eboost:SetValue(1000)' multiplayer-deck-master/c153000012.lua
          grep -Fq 'e1:SetValue(-1350)' multiplayer-deck-master/c511001152.lua

          # Card of Sanctity regression copied from the uploaded replay state:
          # P2 is displayed while side-0 active logical player is P3.
          python3 - <<'PY'
          hands = {0:[1,2,3,4,5], 1:[11,12,13,14,15], 2:[21,22,23,24], 3:[]}
          active = [2,3]
          focus = [1,0]
          hands[0].append(101)  # custom multiplayer draw P1
          hands[1].append(102)  # custom multiplayer draw P2
          logical = active[0]   # standard side-0 MSG_DRAW belongs to active P3
          hands[logical].extend([103,104])
          assert hands[1] == [11,12,13,14,15,102]
          assert hands[2] == [21,22,23,24,103,104]
          assert focus[0] == 1
          print('Card of Sanctity logical-hand isolation regression passed')
          PY

          # Projection identity regression: repeated P2 snapshots keep identity,
          # but an actual P2 -> P1 view switch performs exactly one clean reset.
          python3 - <<'PY'
          projected = 1
          reset_same = projected != 1
          assert reset_same is False
          reset_switch = projected != 0
          assert reset_switch is True
          projected = 0
          assert (projected != 0) is False
          print('Logical projection identity regression passed')
          PY

          git -C ocgcore diff --check
          git diff --check

  windows:
    name: Windows hardened replay v3 client
    runs-on: windows-2022
    needs: validate
    env:
      TRAVIS_OS_NAME: windows
      BUILD_CONFIG: release
      ARCH: x86
      BUNDLED_CORE: "1"
      DXSDK_DIR: /c/d3d9sdk/
      VCPKG_ROOT: /c/vcpkg2
      VCPKG_CACHE_ZIP_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download/installed_x86-windows-static.zip
      DEPENDENCIES_BASE_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download
      DEPLOY_DIR: deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply replay-safe P2 Deck Master ownership
        shell: bash
        run: python .github/scripts/apply-3v1-core-owner-no-view-swap.py
      - name: Apply replay hardening v3
        shell: bash
        run: |
          python .github/scripts/apply-3v1-replay-hardening.py
          python .github/scripts/apply-3v1-replay-hardening-v2.py
          python .github/scripts/apply-3v1-replay-projection-v3.py
      - uses: microsoft/setup-msbuild@v3
      - name: Install v141 XP toolset
        shell: pwsh
        run: |
          Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
          $InstallPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $componentsToAdd = @("Microsoft.VisualStudio.Component.VC.v141.x86.x64","Microsoft.VisualStudio.Component.WinXP")
          [string]$workloadArgs = $componentsToAdd | ForEach-Object { " --add " + $_ }
          $arguments = ('/c', "vs_installer.exe", 'modify', '--installPath', "`"$InstallPath`"", $workloadArgs, '--quiet', '--norestart', '--nocache')
          $process = Start-Process -FilePath "cmd.exe" -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Visual Studio Installer exited with code $($process.ExitCode)" }
      - name: Install Premake
        shell: bash
        run: ./travis/install-premake5.sh
      - name: Install dependencies
        shell: bash
        run: ./travis/dependencies.sh
      - name: Build
        shell: bash
        run: ./travis/build.sh
      - name: Package patched client
        shell: bash
        run: |
          set -euo pipefail
          ./travis/predeploy.sh
          mkdir -p deploy/expansions/script deploy/textures
          cp multiplayer-deck-master/c*.lua deploy/expansions/script/
          cp multiplayer-effect-examples/c25880422.lua deploy/expansions/script/c25880422.lua
          cp textures/field-3v1.png deploy/textures/field-3v1.png
          cp -r multiplayer-deck-master deploy/
          cp -r multiplayer-effect-examples deploy/
          rm -f deploy/compressed-ygopro.exe
          test -f deploy/ygopro.exe
          test -f deploy/expansions/script/c153000012.lua
          test -f deploy/expansions/script/c511001152.lua
      - uses: actions/upload-artifact@v4
        with:
          name: edopro-3v1-replay-hardening-v3-windows-x86-no-upx
          path: deploy/
          if-no-files-found: error
