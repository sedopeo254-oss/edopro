name: Replay Source Export

on:
  pull_request:
    branches:
      - stable/3v1-replay-targeting-fixed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Export source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude='ocgcore/.git' -czf replay-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: replay-source
          path: replay-source.tar.gz
          if-no-files-found: error
