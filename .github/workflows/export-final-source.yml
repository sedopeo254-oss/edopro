name: Export Final Replay Source

on:
  push:
    branches:
      - fix/3v1-replay-smooth-final-v2-20260826

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Export source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude-vcs -czf replay-smooth-final-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: replay-smooth-final-source
          path: replay-smooth-final-source.tar.gz
          if-no-files-found: error
