name: 4-Way Anime Battle Royale Cards Round 2 + Swap Player Windows

on:
  push:
    branches:
      - fix/4way-anime-cards-round2-20260914
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 4way-anime-cards-round2-${{ github.ref }}
  cancel-in-progress: true

env:
  PROTECTED_3V1_SHA: ef0b3f205cfd97b5fae6a181e1164c737affc896
  FEATURE_CORE_SHA: 48fc2f0de4a67766e9667f9669650c3f594a3255
  WINDBOT_SHA: fa0ae767967afc6a820784837f11cd3fabb9c47c
  DEPENDENCIES_BASE_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download
  DEPLOY_DIR: deploy

jobs:
  validate:
    name: Validate anime cards / turn order / Swap player / protected 3v1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify exact protected baselines
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ocgcore rev-parse HEAD)" = "$FEATURE_CORE_SHA"
          test "$(git ls-remote origin refs/heads/stable/3v1-replay-targeting-fixed | cut -f1)" = "$PROTECTED_3V1_SHA"
          git merge-base --is-ancestor d45ba39eff95c65ffc496b2b7d945130e3252fed HEAD
          grep -Fq 'Kaiba 3300 must go first' ocgcore/tests/multiplayer_state_tests.cpp
          grep -Fq '3v1 must reject Battle Royale turn-order changes' ocgcore/tests/multiplayer_state_tests.cpp

      - name: Materialize uploaded anime card and client fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/install-4way-attack-guidance-armor.py
          python3 .github/scripts/apply-4way-anime-client-fixes.py
          test -f multiplayer-deck-master/c412.lua
          grep -Fq 'CycleBattleRoyaleOpponent' gframe/client_field.cpp
          grep -Fq 'Swap the player' gframe/duelclient.cpp
          grep -Fq 'CycleBattleRoyaleOpponent' gframe/event_handler.cpp
          git diff --check

      - name: Validate anime card scripts and requested behavior
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          for script in \
            multiplayer-deck-master/c412.lua \
            multiplayer-deck-master/c296499.lua \
            multiplayer-deck-master/c3819470.lua \
            multiplayer-deck-master/c511001785.lua \
            multiplayer-deck-master/c199.lua \
            multiplayer-deck-master/c83555666.lua; do
            luac5.4 -p "$script"
          done
          grep -Fq 'Duel.ChangeAttackTarget(tc,true)' multiplayer-deck-master/c412.lua
          grep -Fq 'Duel.GetPlayerFieldGroup(logical,LOCATION_MZONE)' multiplayer-deck-master/c412.lua
          grep -Fq 'Duel.DamagePlayer(logical,total,REASON_EFFECT,false,tp,false)' multiplayer-deck-master/c511001785.lua
          grep -Fq 'Duel.DamagePlayer(logical,dam,REASON_BATTLE,false,tp,false)' multiplayer-deck-master/c511001785.lua
          grep -Fq 'Duel.NegateActivation(ch)' multiplayer-deck-master/c3819470.lua
          grep -Fq 'Duel.GetPlayerFieldGroup(logical,LOCATION_GRAVE)' multiplayer-deck-master/c199.lua
          grep -Fq 'Duel.ConfirmCards(tp,g)' multiplayer-deck-master/c199.lua
          grep -Fq 'Duel.DamagePlayer(p,atk,REASON_EFFECT,true,tp,false)' multiplayer-deck-master/c83555666.lua
          grep -Fq 'Duel.RDComplete()' multiplayer-deck-master/c83555666.lua
          grep -Fq 'EFFECT_CANNOT_ATTACK' multiplayer-deck-master/c296499.lua
          grep -Fq 'EVENT_ATTACK_ANNOUNCE' multiplayer-deck-master/c296499.lua
          grep -Fq 'Duel.NegateAttack()' multiplayer-deck-master/c296499.lua

      - name: Run Core turn-order and multiplayer tests
        shell: bash
        run: |
          set -euo pipefail
          sh ./ocgcore/tests/run_multiplayer_state_tests.sh
          sh ./ocgcore/tests/run_multiplayer_field_tests.sh
          grep -Fq 'Kaiba 3300 must go first' ocgcore/tests/multiplayer_state_tests.cpp
          grep -Fq 'Marik 1700 must go second' ocgcore/tests/multiplayer_state_tests.cpp
          grep -Fq 'Yugi 1300 must go third' ocgcore/tests/multiplayer_state_tests.cpp
          grep -Fq 'Joey 500 must go last' ocgcore/tests/multiplayer_state_tests.cpp
          grep -Fq 'TYPE_MONSTER' ocgcore/battle_royale_turn_order.cpp
          grep -Fq 'LOCATION_REMOVED' ocgcore/battle_royale_turn_order.cpp
          grep -Fq 'POS_FACEUP' ocgcore/battle_royale_turn_order.cpp
          grep -Fq 'REASON_RULE' ocgcore/battle_royale_turn_order.cpp
          git -C ocgcore diff --check

      - name: Run protected client regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            battle_royale_live_ec2_test.cpp \
            battle_royale_replay_smoothing_test.cpp \
            battle_royale_private_snapshot_test.cpp \
            multiplayer_replay_policy_test.cpp \
            multiplayer_attack_arrow_test.cpp \
            multiplayer_replay_animation_test.cpp; do
            if test -f ".github/tests/$test"; then
              c++ -std=c++17 -Wall -Wextra -Werror -I. \
                ".github/tests/$test" -o "/tmp/${test%.cpp}"
              "/tmp/${test%.cpp}"
            fi
          done
          grep -Fq 'SummonTiming{ 22, 8, 8 }' gframe/multiplayer_replay_animation.h
          grep -Fq 'return is_replay && is_three_vs_one ? 12 : 8;' gframe/multiplayer_replay_animation.h
          grep -Fq 'Duel.ChangeAttackTarget(c,true)' multiplayer-deck-master/c153000012.lua
          grep -Fq 'eboost:SetValue(1000)' multiplayer-deck-master/c153000012.lua
          ! grep -Fq 'Duel.FocusLogicalPlayer' multiplayer-deck-master/c153000012.lua
          ! grep -Fq 'Duel.TagSwap(' multiplayer-deck-master/c153000012.lua
          git diff --check

  windbot:
    name: Build WindBot with Battle Royale spell-loop guard
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ProjectIgnis/windbot
          ref: ${{ env.WINDBOT_SHA }}
          path: windbot
          submodules: recursive
      - name: Apply protected 3v1 patch and Battle Royale guard
        shell: bash
        run: |
          set -euo pipefail
          git -C windbot apply --unidiff-zero ../.github/patches/windbot-3v1.patch
          python3 .github/scripts/apply-windbot-battle-royale-loop.py windbot
          grep -Fq 'public bool IsThreeVsOne' windbot/ExecutorBase/Game/Duel.cs
          grep -Fq 'public bool IsBattleRoyale' windbot/ExecutorBase/Game/Duel.cs
          grep -Fq 'DUEL_BATTLE_ROYALE_HIGH = 0x20' windbot/Game/GameBehavior.cs
          grep -Fq 'packet.BaseStream.Position = packet.BaseStream.Length' windbot/Game/GameBehavior.cs
          git -C windbot diff --check
      - name: Build WindBot
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/projectignis/mono_xamarin_builder_monodroid:master
          docker image tag ghcr.io/projectignis/mono_xamarin_builder_monodroid:master monodroid
          cd windbot
          docker run --rm --volume "$PWD:/project" monodroid -t:restore -p:RestorePackagesPath=./.nuget WindBot.sln
          ./ci/install-patched-mono-runtime.sh
          docker run --rm --volume "$PWD:/project" monodroid -m -p:Configuration=Release WindBot.sln -p:Posix=true
      - name: Package WindBot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p windbot-package/WindBot
          cp -r windbot/bin/Release/. windbot-package/WindBot/
          rm -f windbot-package/WindBot/mscorlib* windbot-package/WindBot/libWindbot*
          cp windbot/COPYING windbot/LICENSE windbot/bots.json windbot-package/WindBot/
          cp -r windbot/Decks windbot/Dialogs windbot-package/WindBot/
          test -f windbot-package/WindBot/WindBot.exe
          test -f windbot-package/WindBot/ExecutorBase.dll
      - uses: actions/upload-artifact@v4
        with:
          name: windbot-4way-anime-loop-fixed
          path: windbot-package/
          if-no-files-found: error

  windows:
    name: Windows x86 anime Battle Royale client
    runs-on: windows-2022
    needs: [validate, windbot]
    env:
      TRAVIS_OS_NAME: windows
      BUILD_CONFIG: release
      ARCH: x86
      BUNDLED_CORE: "1"
      DXSDK_DIR: /c/d3d9sdk/
      VCPKG_ROOT: /c/vcpkg2
      VCPKG_CACHE_ZIP_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download/installed_x86-windows-static.zip
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply anime card and client fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ocgcore rev-parse HEAD)" = "$FEATURE_CORE_SHA"
          python3 .github/scripts/install-4way-attack-guidance-armor.py
          python3 .github/scripts/apply-4way-anime-client-fixes.py
          test -f multiplayer-deck-master/c412.lua
      - uses: microsoft/setup-msbuild@v3
      - name: Install v141 XP toolset
        shell: pwsh
        run: |
          Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
          $InstallPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $componentsToAdd = @(
            "Microsoft.VisualStudio.Component.VC.v141.x86.x64",
            "Microsoft.VisualStudio.Component.WinXP"
          )
          [string]$workloadArgs = $componentsToAdd | ForEach-Object { " --add " + $_ }
          $arguments = ('/c', "vs_installer.exe", 'modify', '--installPath', "`"$InstallPath`"", $workloadArgs, '--quiet', '--norestart', '--nocache')
          $process = Start-Process -FilePath "cmd.exe" -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Visual Studio Installer exited with code $($process.ExitCode)" }
      - name: Install Premake and dependencies
        shell: bash
        run: |
          ./travis/install-premake5.sh
          ./travis/dependencies.sh
      - name: Build bundled client
        shell: bash
        run: ./travis/build.sh
      - name: Package no-UPX client and current custom scripts
        shell: bash
        run: |
          set -euo pipefail
          ./travis/predeploy.sh
          mkdir -p deploy/textures deploy/expansions/script
          cp textures/field-3v1.png deploy/textures/field-3v1.png
          cp -r multiplayer-effect-examples deploy/
          cp -r multiplayer-deck-master deploy/
          cp multiplayer-effect-examples/c25880422.lua deploy/expansions/script/c25880422.lua
          cp multiplayer-deck-master/c*.lua deploy/expansions/script/
          rm -f deploy/compressed-ygopro.exe
          test -f deploy/ygopro.exe
          test -f deploy/textures/field-3v1.png
          test -f deploy/expansions/script/c412.lua
          test -f deploy/expansions/script/c296499.lua
          test -f deploy/expansions/script/c3819470.lua
          test -f deploy/expansions/script/c511001785.lua
          test -f deploy/expansions/script/c199.lua
          test -f deploy/expansions/script/c83555666.lua
          test -f deploy/expansions/script/c153000012.lua
          test -f deploy/expansions/script/c511001152.lua
          test -f deploy/expansions/script/c511000405.lua
          test ! -f deploy/compressed-ygopro.exe
      - uses: actions/download-artifact@v4
        with:
          name: windbot-4way-anime-loop-fixed
          path: deploy/
      - uses: actions/upload-artifact@v4
        with:
          name: edopro-4way-anime-cards-round2-windows-x86-no-upx
          path: deploy/
          if-no-files-found: error

  publish-source:
    name: Publish tested client/card source
    runs-on: ubuntu-24.04
    needs: [validate, windbot, windows]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/4way-anime-cards-round2-20260914
          submodules: recursive
          fetch-depth: 0
      - name: Apply tested generated source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ocgcore rev-parse HEAD)" = "$FEATURE_CORE_SHA"
          python3 .github/scripts/install-4way-attack-guidance-armor.py
          python3 .github/scripts/apply-4way-anime-client-fixes.py
          git diff --check
      - name: Commit generated source without retriggering CI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            multiplayer-deck-master/c412.lua \
            gframe/client_field.h \
            gframe/client_field.cpp \
            gframe/event_handler.cpp \
            gframe/duelclient.cpp
          if ! git diff --cached --quiet; then
            git commit -m "Add Battle Royale anime cards and Swap the player [skip ci]"
            git push origin HEAD:fix/4way-anime-cards-round2-20260914
          fi
