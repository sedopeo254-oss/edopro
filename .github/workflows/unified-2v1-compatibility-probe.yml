name: Unified 2v1 Compatibility Probe

on:
  push:
    branches:
      - feature/inherited-duel-succession-v1-20261105
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Adapt legacy 2v1 to unused flag (preserve Inherited Duel)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in (
              Path('.github/scripts/apply-2v1-clean-core.py'),
              Path('.github/scripts/apply-2v1-clean-client-server.py')
          ):
              content = path.read_text(encoding='utf-8')
              content = content.replace('DUEL_2_V_1             0x8000000000ULL',
                                        'DUEL_2_V_1             0x10000000000ULL')
              path.write_text(content,encoding='utf-8')
          PY
          python3 .github/scripts/apply-2v1-clean-core.py
          # The legacy 2v1 patcher predated the Inherited Duel (mode 3) entry.
          # Add mode 4 directly while preserving modes 0..3 byte-for-byte.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('gframe/game.cpp')
          s=p.read_text(encoding='utf-8')
          def one(old,new):
              global s
              assert s.count(old)==1, repr(old[:70])
              s=s.replace(old,new,1)
          one('cbMultiplayerMode->addItem(L"Inherited Duel Mode");',
              'cbMultiplayerMode->addItem(L"Inherited Duel Mode");\n'
              '\t\tcbMultiplayerMode->addItem(L"2 vs 1");')
          one('cbMultiplayerMode->setSelected((duel_param & DUEL_INHERITED_DUEL) ? 3',
              'cbMultiplayerMode->setSelected((duel_param & DUEL_2_V_1) ? 4\n'
              '\t\t\t: (duel_param & DUEL_INHERITED_DUEL) ? 3')
          one('duel_param & (DUEL_BATTLE_ROYALE | DUEL_3_V_1 | DUEL_INHERITED_DUEL);',
              'duel_param & (DUEL_BATTLE_ROYALE | DUEL_3_V_1 | DUEL_INHERITED_DUEL | DUEL_2_V_1);')
          one('duel_param &= ~(DUEL_BATTLE_ROYALE | DUEL_3_V_1 | DUEL_INHERITED_DUEL);',
              'duel_param &= ~(DUEL_BATTLE_ROYALE | DUEL_3_V_1 | DUEL_INHERITED_DUEL | DUEL_2_V_1);')
          one('if(mode == 1) {\n\t\tduel_param |= DUEL_BATTLE_ROYALE;',
              'if(mode == 4) {\n'
              '\t\tduel_param |= DUEL_2_V_1;\n'
              '\t\tebTeam1->setText(L"2");\n'
              '\t\tebTeam2->setText(L"1");\n'
              '\t} else if(mode == 1) {\n'
              '\t\tduel_param |= DUEL_BATTLE_ROYALE;')
          p.write_text(s,encoding='utf-8')
          PY
          # First evaluate every legacy patch site against the new Inherited
          # Duel branch; log incompatible anchors rather than abort at the
          # first old 2v1-only source assumption. This is a diagnostic job.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/apply-2v1-clean-client-server.py')
          src=p.read_text(encoding='utf-8')
          for old,new in [
            ('raise SystemExit(f"{path}: expected one replacement site, found {count}")',
             'print(f"MISSING ONCE {path}: {old[:96]!r} (found {count})"); return'),
            ('raise SystemExit(f"{path}: expected at least {minimum} replacement site(s), found {count}")',
             'print(f"MISSING ALL {path}: {old[:96]!r} (found {count})"); return')
          ]:
            assert old in src,old
            src=src.replace(old,new)
          p.write_text(src,encoding='utf-8')
          PY
          python3 .github/scripts/apply-2v1-clean-client-server.py
      - name: Confirm all special-mode flags coexist
        shell: bash
        run: |
          set -euo pipefail
          for flag in DUEL_2_V_1 DUEL_3_V_1 DUEL_BATTLE_ROYALE DUEL_INHERITED_DUEL; do
            grep -Fq "#define $flag" ocgcore/ocgapi_constants.h
            grep -Fq "#define $flag" gframe/ocgapi_constants.h
          done
          grep -Fq 'addItem(L"2 vs 1")' gframe/game.cpp
          grep -Fq 'addItem(L"Inherited Duel Mode")' gframe/game.cpp
          git diff --check
          git -C ocgcore diff --check
      - name: Check all regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tests/test_inherited_mode_foundation.py
          sh ocgcore/tests/run_multiplayer_state_tests.sh
          sh ocgcore/tests/run_multiplayer_field_tests.sh
          c++ -std=c++17 -I. .github/tests/inherited_duel_hud_test.cpp -o /tmp/inherited_hud
          /tmp/inherited_hud
          c++ -std=c++17 -I. .github/tests/inherited_duel_lobby_test.cpp -o /tmp/inherited_lobby
          /tmp/inherited_lobby
