name: 3v1 Replay Smooth V3 PR Build

on:
  pull_request:
    branches:
      - stable/3v1-replay-targeting-fixed

permissions:
  contents: read

jobs:
  validate:
    name: Validate decoupled field and private-pile replay
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply V3
        run: python3 .github/scripts/run-3v1-replay-smooth-v3.py
      - name: Install Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
      - name: Run core and script regressions
        shell: bash
        run: |
          set -euo pipefail
          sh ./ocgcore/tests/run_multiplayer_state_tests.sh
          # Older owner-lock test may require <algorithm>; ensure test source compiles in this CI checkout.
          grep -Fq '#include <algorithm>' ocgcore/tests/multiplayer_field_tests.cpp || sed -i '1i#include <algorithm>' ocgcore/tests/multiplayer_field_tests.cpp
          sh ./ocgcore/tests/run_multiplayer_field_tests.sh
          luac5.4 -p multiplayer-deck-master/c153000012.lua
          luac5.4 -p multiplayer-deck-master/c511001152.lua
          luac5.4 -p multiplayer-deck-master/c511000405.lua
          grep -Fq 'FIELD CAMERA ONLY' gframe/duelclient.cpp
          grep -Fq 'GetDisplayedPrivateDuelist(core_player)' gframe/duelclient.cpp
          grep -Fq 'GetLogicalPlayer(core_side) == logical_player' gframe/client_field.cpp
          grep -Fq 'const auto logical = mainGame->dInfo.GetLogicalPlayer(core_side);' gframe/client_field.cpp
          grep -Fq 'ApplyThreeVsOneReplayDraw' gframe/duelclient.cpp
          grep -Fq 'active_seat_changed' gframe/duelclient.cpp
          grep -Fq 'SetThreeVsOneView(summon_logical)' gframe/duelclient.cpp
          grep -Fq 'pcard->is_public = true' gframe/duelclient.cpp
          grep -Fq 'smooth_three_vs_one_replay' gframe/duelclient.cpp
          ! grep -Fq 'Duel.FocusLogicalPlayer' multiplayer-deck-master/c153000012.lua
          ! grep -Fq 'Duel.TagSwap(' multiplayer-deck-master/c153000012.lua
          ! grep -Fq 'Duel.ConfirmCards(' multiplayer-deck-master/c153000012.lua
          grep -Fq 'eboost:SetValue(1000)' multiplayer-deck-master/c153000012.lua
          grep -Fq 'e1:SetValue(-1350)' multiplayer-deck-master/c511001152.lua
          grep -Fq 'std::atan2(xd - xa, ya - yd)' gframe/duelclient.cpp
          git -C ocgcore diff --check
          git diff --check
      - name: Simulate Card of Sanctity camera/private-seat separation
        shell: bash
        run: |
          python3 - <<'PY'
          # During Nezbitt's turn the field camera can show P1 while side 0's
          # mounted private pile stays P2. A normal side-0 draw must update P2,
          # never P1 just because P1's field is on camera.
          field_focus = 0      # camera = P1
          logical_active = 1   # private piles = P2
          p1_hand = [101, 102]
          p2_hand = [201, 202, 203]
          draw = [204, 205]
          assert field_focus != logical_active
          p2_hand += draw
          assert p1_hand == [101, 102]
          assert p2_hand == [201, 202, 203, 204, 205]
          # Camera hops do not alter the mounted private seat.
          for field_focus in (2, 0, 1, 0, 2):
              assert logical_active == 1
              assert p2_hand[-2:] == draw
          print('Card of Sanctity / opponent-turn private-pile isolation passed')
          PY

  windows:
    name: Windows replay smooth V3 client
    runs-on: windows-2022
    needs: validate
    env:
      TRAVIS_OS_NAME: windows
      BUILD_CONFIG: release
      ARCH: x86
      BUNDLED_CORE: "1"
      DXSDK_DIR: /c/d3d9sdk/
      VCPKG_ROOT: /c/vcpkg2
      VCPKG_CACHE_ZIP_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download/installed_x86-windows-static.zip
      DEPENDENCIES_BASE_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download
      DEPLOY_DIR: deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply V3
        shell: bash
        run: python .github/scripts/run-3v1-replay-smooth-v3.py
      - uses: microsoft/setup-msbuild@v3
      - name: Install v141 XP toolset
        shell: pwsh
        run: |
          Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
          $InstallPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $componentsToAdd = @("Microsoft.VisualStudio.Component.VC.v141.x86.x64","Microsoft.VisualStudio.Component.WinXP")
          [string]$workloadArgs = $componentsToAdd | ForEach-Object { " --add " + $_ }
          $arguments = ('/c', "vs_installer.exe", 'modify', '--installPath', "`"$InstallPath`"", $workloadArgs, '--quiet', '--norestart', '--nocache')
          $process = Start-Process -FilePath "cmd.exe" -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Visual Studio Installer exited with code $($process.ExitCode)" }
      - name: Install Premake
        shell: bash
        run: ./travis/install-premake5.sh
      - name: Install dependencies
        shell: bash
        run: ./travis/dependencies.sh
      - name: Build
        shell: bash
        run: ./travis/build.sh
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          ./travis/predeploy.sh
          mkdir -p deploy/expansions/script deploy/textures
          cp multiplayer-deck-master/c*.lua deploy/expansions/script/
          cp multiplayer-effect-examples/c25880422.lua deploy/expansions/script/c25880422.lua
          cp textures/field-3v1.png deploy/textures/field-3v1.png
          cp -r multiplayer-deck-master deploy/
          cp -r multiplayer-effect-examples deploy/
          rm -f deploy/compressed-ygopro.exe
          test -f deploy/ygopro.exe
          test -f deploy/expansions/script/c153000012.lua
          ! grep -Fq 'Duel.ConfirmCards(' deploy/expansions/script/c153000012.lua
      - uses: actions/upload-artifact@v4
        with:
          name: edopro-3v1-replay-smooth-v3-windows-x86-no-upx
          path: deploy/
          if-no-files-found: error
