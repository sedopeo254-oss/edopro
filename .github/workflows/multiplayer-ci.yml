name: Multiplayer CI

on:
  push:
    branches:
      - agent/multiplayer-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multiplayer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-export:
    name: Export exact multiplayer source snapshot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Package checked-out sources
        shell: bash
        run: |
          rm -rf .git ocgcore/.git
          tar -czf ../edopro-multiplayer-source.tar.gz .
          mv ../edopro-multiplayer-source.tar.gz ./
      - uses: actions/upload-artifact@v4
        with:
          name: edopro-multiplayer-source
          path: edopro-multiplayer-source.tar.gz
          if-no-files-found: error
