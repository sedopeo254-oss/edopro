name: Apply minimal replay and targeting client backport

on:
  push:
    branches:
      - automation/apply-minimal-replay-client-20260811

permissions:
  contents: write

concurrency:
  group: apply-minimal-replay-client-20260811
  cancel-in-progress: false

jobs:
  apply-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply only the reviewed client replay and arrow patch
        shell: bash
        env:
          TARGET_BRANCH: candidate/3v1-replay-targeting-minimal-20260811
          CORE_SHA: 4f21cd92c0956e46f51fbaf8386e0fd4bce87bbf
        run: |
          set -euo pipefail
          cat .github/patches/minimal-client.part*.b64 > /tmp/minimal-client.b64
          test "$(wc -c < /tmp/minimal-client.b64)" = 7168
          test "$(git hash-object /tmp/minimal-client.b64)" = 15d6a932ec94b39b64326c48e62bd10f548275e9
          base64 -d /tmp/minimal-client.b64 | gzip -d > /tmp/minimal-client.patch
          git fetch origin "$TARGET_BRANCH"
          git checkout -B publish-target "origin/$TARGET_BRANCH"
          git apply --check /tmp/minimal-client.patch
          git apply /tmp/minimal-client.patch
          git diff --check

          expected=$(printf '%s\n' \
            gframe/client_field.cpp \
            gframe/client_field.h \
            gframe/duelclient.cpp | sort)
          actual=$(git diff --name-only | sort)
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$actual"
            exit 1
          fi

          ! git diff | grep -E 'DUEL_UNIVERSAL_MULTIPLAYER|UniversalMultiplayer|configure_universal|KingOfAnime'
          grep -q 'SetThreeVsOneView' gframe/duelclient.cpp
          grep -q 'IsThreeVsOneReplayPrivatePileDisplayed' gframe/client_field.cpp
          grep -q 'final arrow attached to the authoritative fields' gframe/duelclient.cpp
          grep -q 'std::atan2(xd - xa, ya - yd)' gframe/duelclient.cpp

          test "${#CORE_SHA}" = 40
          git cat-file -e "$CORE_SHA^{commit}" 2>/dev/null || git fetch https://github.com/sedopeo254-oss/ygopro-core.git "$CORE_SHA"
          git update-index --add --cacheinfo 160000,"$CORE_SHA",ocgcore
          git diff --check

      - name: Publish the isolated candidate client and core pointer
        shell: bash
        env:
          TARGET_BRANCH: candidate/3v1-replay-targeting-minimal-20260811
        run: |
          set -euo pipefail
          git config user.name "sedopeo254-oss"
          git config user.email "sedopeo254@gmail.com"
          git add -- \
            gframe/client_field.cpp \
            gframe/client_field.h \
            gframe/duelclient.cpp \
            ocgcore
          git diff --cached --check
          git commit -m "Backport replay perspective, attack direction and targeting without CaD"
          git push origin HEAD:"$TARGET_BRANCH"
