name: Publish 3v1 LP animation state hotfix

on:
  push:
    branches:
      - automation/publish-3v1-anime-fixes

permissions:
  contents: write

concurrency:
  group: publish-anime-3v1-client
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the missing logical LP animation state
        shell: bash
        env:
          TARGET_BRANCH: agent/multiplayer-foundation
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout -B publish-target "origin/$TARGET_BRANCH"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('gframe/game.h')
          text = path.read_text()
          old = '\tint lpplayer;\n\tint lpccolor;'
          new = '\tint lpplayer;\n\tint lp_logical_player = -1;\n\tint lpccolor;'
          if text.count(old) != 1:
              raise SystemExit(
                  f'expected exactly one LP animation field insertion point, found {text.count(old)}')
          if 'int lp_logical_player = -1;' in text:
              raise SystemExit('logical LP animation state is already present')
          path.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          grep -q '^\s*int lp_logical_player = -1;' gframe/game.h
          test "$(git diff --name-only | tr -d '\r')" = "gframe/game.h"

          git config user.name "sedopeo254-oss"
          git config user.email "sedopeo254@gmail.com"
          git add -- gframe/game.h
          git diff --cached --check
          git commit -m "Restore logical LP animation state"
          git push origin HEAD:"$TARGET_BRANCH"
