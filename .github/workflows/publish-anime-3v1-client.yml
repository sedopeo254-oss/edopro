name: Publish anime 3v1 client fixes

on:
  push:
    branches:
      - automation/publish-3v1-anime-fixes

permissions:
  contents: write

concurrency:
  group: publish-anime-3v1-client
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode reviewed patch
        shell: bash
        run: |
          base64 --decode .github/publish/client.patch.gz.b64 | gzip -dc > /tmp/client.patch
          test "$(sha256sum /tmp/client.patch | cut -d' ' -f1)" = "8f0643535d809b5e0066257a34c4f2889b8da93ae275cd69586d456188a164ee"

      - name: Apply, test, commit, and publish
        shell: bash
        env:
          TARGET_BRANCH: agent/multiplayer-foundation
          CORE_SHA: 97ab43e00959d77573e74110212dd0d1e221b988
          STABLE_CLIENT_SHA: 5777d9b101bf7c789aa23a6fa6f94723238617cf
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout -B publish-target "origin/$TARGET_BRANCH"
          git apply --check /tmp/client.patch
          git apply /tmp/client.patch

          # Restore the full production workflow that was temporarily replaced
          # only to export the exact source snapshot.
          git show "$STABLE_CLIENT_SHA:.github/workflows/multiplayer-ci.yml" > .github/workflows/multiplayer-ci.yml

          git diff --check
          c++ -std=c++17 -Wall -Wextra -Werror -I. \
            .github/tests/multiplayer_ui_test.cpp \
            -o /tmp/multiplayer-ui-test
          /tmp/multiplayer-ui-test

          git config user.name "sedopeo254-oss"
          git config user.email "sedopeo254@gmail.com"
          git add -- \
            .github/tests/multiplayer_ui_test.cpp \
            .github/workflows/multiplayer-ci.yml \
            gframe/client_field.cpp \
            gframe/client_field.h \
            gframe/drawing.cpp \
            gframe/duelclient.cpp \
            gframe/event_handler.cpp \
            gframe/game.h \
            gframe/generic_duel.cpp \
            gframe/multiplayer_packets.h \
            gframe/multiplayer_ui.h \
            multiplayer-effect-examples/README.md \
            multiplayer-effect-examples/c25880422.lua
          git update-index --add --cacheinfo 160000,"$CORE_SHA",ocgcore
          git diff --cached --check
          git commit -m "Fix anime 3v1 LP, targeting, graves and replay"
          git push origin HEAD:"$TARGET_BRANCH"
