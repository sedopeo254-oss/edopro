name: Inherited Duel Mode - Engine and Windows

on:
  push:
    branches:
      - feature/inherited-duel-succession-v1-20261105
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inherited-duel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-build:
    name: Compile Inherited Duel core + regression tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Confirm new core and original protected modes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tests/test_inherited_mode_foundation.py
          sh ocgcore/tests/run_duel_succession_tests.sh
          sh ocgcore/tests/run_duel_succession_transfer_tests.sh
          sh ocgcore/tests/run_multiplayer_state_tests.sh
          sh ocgcore/tests/run_multiplayer_field_tests.sh
      - name: Verify active on-screen names in Kaiba-Yugi-Noah succession
        shell: bash
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. .github/tests/inherited_duel_hud_test.cpp -o /tmp/inherited_duel_hud_test
          /tmp/inherited_duel_hud_test
      - name: Test inherited lobby role labels and starting seat
        shell: bash
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. .github/tests/inherited_duel_lobby_test.cpp -o /tmp/inherited_duel_lobby_test
          /tmp/inherited_duel_lobby_test
      - name: Install C++/Meson build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config liblua5.4-dev
      - name: Compile all C++ core objects including live succession
        shell: bash
        run: |
          set -euo pipefail
          meson setup /tmp/inherited-core-build ocgcore -Dbuildtype=release
          # EDOPro builds Lua sources as C++, whereas Ubuntu's system Lua
          # library is built as C. Linux verifies every core C++ object;
          # the bundled Windows job performs the authoritative full link.
          mapfile -t objects < <(ninja -C /tmp/inherited-core-build -t targets all |
            grep -F 'libocgcore.so.p/' | grep -F '.cpp.o:' | cut -d: -f1)
          test "${#objects[@]}" -ge 17
          ninja -C /tmp/inherited-core-build "${objects[@]}"

  windows:
    name: Windows x86 Inherited Duel executable (no UPX)
    runs-on: windows-2022
    needs: core-build
    env:
      TRAVIS_OS_NAME: windows
      BUILD_CONFIG: release
      ARCH: x86
      BUNDLED_CORE: "1"
      DXSDK_DIR: /c/d3d9sdk/
      VCPKG_ROOT: /c/vcpkg2
      VCPKG_CACHE_ZIP_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download/installed_x86-windows-static.zip
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check current protected branch and mode source
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tests/test_inherited_mode_foundation.py
          test -f multiplayer-deck-master/c153999999.lua
          test -f multiplayer-deck-master/c153000000.lua
          test -f textures/field-3v1.png
      - uses: microsoft/setup-msbuild@v3
      - name: Install old Windows toolset (matching existing EDOPro builds)
        shell: pwsh
        run: |
          Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
          $InstallPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $Components = @("Microsoft.VisualStudio.Component.VC.v141.x86.x64", "Microsoft.VisualStudio.Component.WinXP")
          [string]$ArgsText = $Components | ForEach-Object { " --add " + $_ }
          $arguments = ('/c', "vs_installer.exe", 'modify', '--installPath', "`"$InstallPath`"", $ArgsText, '--quiet', '--norestart', '--nocache')
          $process = Start-Process -FilePath "cmd.exe" -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Toolset install failed with $($process.ExitCode)" }
      - name: Install Premake and EDOPro dependencies
        shell: bash
        run: |
          ./travis/install-premake5.sh
          ./travis/dependencies.sh
      - name: Compile modified EDOPro and bundled core
        shell: bash
        run: bash ./travis/build-inherited-windows.sh
      - name: Package standalone Inherited Duel build and existing expansions
        shell: bash
        run: |
          set -euo pipefail
          ./travis/predeploy.sh
          mkdir -p deploy/mode-info deploy/textures deploy/expansions/script
          cp -f textures/field-3v1.png deploy/textures/field-3v1.png
          cp multiplayer-deck-master/c*.lua deploy/expansions/script/
          cp multiplayer-anime-cards/c*.lua deploy/expansions/script/
          cp multiplayer-effect-examples/c*.lua deploy/expansions/script/
          cp INHERITED_DUEL_MODE.md deploy/mode-info/INHERITED_DUEL_MODE.md
          rm -f deploy/compressed-ygopro.exe
          test -f deploy/ygopro.exe
          test ! -f deploy/compressed-ygopro.exe
      - uses: actions/upload-artifact@v4
        with:
          name: edopro-inherited-duel-windows-x86
          path: deploy/
          if-no-files-found: error
