name: 3v1 Replay Compatibility Binary Windows

on:
  push:
    branches:
      - fix/3v1-replay-universal-compat-20260826

permissions:
  contents: write

concurrency:
  group: 3v1-replay-compat-binary-final
  cancel-in-progress: true

env:
  DEPENDENCIES_BASE_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download
  DEPLOY_DIR: deploy

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      commit_sha: ${{ steps.publish.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply exact binary compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ocgcore rev-parse HEAD)" = "bb0c48e455857156b55a223d1766d416e16dbf10"
          echo "3d6bd46dddcfb304366b7a8391443c75c49cf46d90099647459c2dc6b111a2f7  .github/replay-compat/replay-compatibility.patch.gz" | sha256sum -c -
          gzip -dc .github/replay-compat/replay-compatibility.patch.gz > /tmp/replay-compatibility.patch
          echo "fed19ebdbd29d2718cae6c9cde6518c24d8b597c3460496da2e79c9eb5b95182  /tmp/replay-compatibility.patch" | sha256sum -c -
          git apply --check /tmp/replay-compatibility.patch
          git apply /tmp/replay-compatibility.patch
          git diff --check

      - name: Test compatibility and replay policy
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror -I. .github/tests/replay_compatibility_test.cpp -o /tmp/replay-compatibility-test
          /tmp/replay-compatibility-test
          c++ -std=c++17 -Wall -Wextra -Werror -I. .github/tests/multiplayer_replay_policy_test.cpp -o /tmp/multiplayer-replay-policy-test
          /tmp/multiplayer-replay-policy-test
          sh ./ocgcore/tests/run_multiplayer_state_tests.sh
          sh ./ocgcore/tests/run_multiplayer_field_tests.sh

      - name: Verify compatibility and card markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'SOURCE13_SCHEMA = 1' gframe/replay_compat.h
          grep -Fq 'CURRENT_SCHEMA = 2' gframe/replay_compat.h
          grep -Fq 'MSG_MULTIPLAYER_REPLAY_CAPS' gframe/replay_compat.h
          grep -Fq 'CAP_PRIVATE_PILE_SNAPSHOTS' gframe/replay_compat.h
          grep -Fq 'IsSkippableExtension' gframe/replay_compat.h
          grep -Fq 'Legacy / schema 0' REPLAY_COMPATIBILITY.md
          grep -Fq 'Source export #13 / schema 1' REPLAY_COMPATIBILITY.md
          grep -Fq 'Capability envelope / schema 2+' REPLAY_COMPATIBILITY.md
          grep -Fq 'ReplayCompat::MakeMetadataPacket' gframe/generic_duel.cpp
          grep -Fq 'ReplayCompat::MakeMetadataPacket' gframe/single_mode.cpp
          grep -Fq 'ReplayCompat::MakeMetadataPacket' gframe/duelclient.cpp
          grep -Fq 'Duel.ChangeAttackTarget(c,true)' multiplayer-deck-master/c153000012.lua
          grep -Fq 'eboost:SetValue(1000)' multiplayer-deck-master/c153000012.lua
          ! grep -Fq 'Duel.FocusLogicalPlayer' multiplayer-deck-master/c153000012.lua
          ! grep -Fq 'Duel.TagSwap(' multiplayer-deck-master/c153000012.lua
          grep -Fq 'SetValue(-1350)' multiplayer-deck-master/c511001152.lua
          grep -Fq '15744417' multiplayer-deck-master/c511001152.lua
          grep -Fq '140000073' multiplayer-deck-master/c511001152.lua
          grep -Fq 's.machineboosttarget' multiplayer-deck-master/c511000405.lua
          grep -Fq 'Duel.SelectEffectPlayers' multiplayer-effect-examples/c25880422.lua

      - name: Publish tested source
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/replay-compat
          rm -f .github/workflows/3v1-replay-universal-compat-build.yml
          rm -f .github/workflows/3v1-replay-compat-binary-windows.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add compatible replay profiles to Source Export 13 baseline"
          git push origin HEAD:fix/3v1-replay-universal-compat-20260826
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows:
    runs-on: windows-2022
    needs: prepare
    env:
      TRAVIS_OS_NAME: windows
      BUILD_CONFIG: release
      ARCH: x86
      BUNDLED_CORE: "1"
      DXSDK_DIR: /c/d3d9sdk/
      VCPKG_ROOT: /c/vcpkg2
      VCPKG_CACHE_ZIP_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download/installed_x86-windows-static.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          submodules: recursive
      - uses: microsoft/setup-msbuild@v3
      - name: Install v141 XP toolset
        shell: pwsh
        run: |
          Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
          $InstallPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $componentsToAdd = @("Microsoft.VisualStudio.Component.VC.v141.x86.x64", "Microsoft.VisualStudio.Component.WinXP")
          [string]$workloadArgs = $componentsToAdd | ForEach-Object { " --add " + $_ }
          $arguments = ('/c', "vs_installer.exe", 'modify', '--installPath', "`"$InstallPath`"", $workloadArgs, '--quiet', '--norestart', '--nocache')
          $process = Start-Process -FilePath "cmd.exe" -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Visual Studio Installer exited with code $($process.ExitCode)" }
      - name: Build bundled client
        shell: bash
        run: |
          set -euo pipefail
          ./travis/install-premake5.sh
          ./travis/dependencies.sh
          ./travis/build.sh
      - name: Package no-UPX client
        shell: bash
        run: |
          set -euo pipefail
          ./travis/predeploy.sh
          mkdir -p deploy/textures deploy/expansions/script
          cp textures/field-3v1.png deploy/textures/field-3v1.png
          cp -r multiplayer-effect-examples deploy/
          cp -r multiplayer-deck-master deploy/
          cp multiplayer-effect-examples/c25880422.lua deploy/expansions/script/c25880422.lua
          cp multiplayer-deck-master/c*.lua deploy/expansions/script/
          cp REPLAY_COMPATIBILITY.md deploy/REPLAY_COMPATIBILITY.md
          rm -f deploy/compressed-ygopro.exe
          test -f deploy/ygopro.exe
          test -f deploy/expansions/script/c153000012.lua
          test -f deploy/expansions/script/c511001152.lua
      - uses: actions/upload-artifact@v4
        with:
          name: edopro-3v1-replay-compatible-windows-x86-no-upx
          path: deploy/
          if-no-files-found: error
