name: Build Ai Duel Windows
on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]
    paths:
      - 'tools/ai-duel/**'
      - 'tools/ai-duel-v0.3/**'
      - '.github/workflows/ai-duel-build.yml'
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct Ai Duel v0.3 source
        shell: pwsh
        run: |
          $chunks = Get-ChildItem 'tools/ai-duel-v0.3/*.b64' | Sort-Object Name
          if ($chunks.Count -ne 6) { throw "Expected 6 chunks, found $($chunks.Count)" }
          $b64 = ($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('ai-duel-v0.3-build.zip', [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Path 'ai-duel-v0.3-build' -Force | Out-Null
          tar -xf 'ai-duel-v0.3-build.zip' -C 'ai-duel-v0.3-build'
          if (-not (Test-Path 'ai-duel-v0.3-build/package.json')) { throw 'Reconstructed source is missing package.json' }
          if (-not (Test-Path 'ai-duel-v0.3-build/assets/icon.ico')) { throw 'Reconstructed source is missing icon.ico' }
      - name: Install dependencies
        working-directory: ai-duel-v0.3-build
        run: npm install
      - name: Run Ai Duel smoke tests
        working-directory: ai-duel-v0.3-build
        run: npm test
      - name: Build portable Windows x64 EXE
        working-directory: ai-duel-v0.3-build
        run: npm run build:win
      - name: Upload Ai Duel EXE
        uses: actions/upload-artifact@v4
        with:
          name: Ai-Duel-v0.3.0-Windows-x64
          path: ai-duel-v0.3-build/dist/*.exe
          if-no-files-found: error
          retention-days: 30
